version: 1
deployment:
  name: bootstrap-example
  path: deployments/bootstrap-example
  template_base: empty
  description: Example deployment being prepared by the bootstrapper.
  postgres:
    dsn: ${OKG_DSN}
domain_brief:
  text: "Track changing operational documents and source records."
  example_questions:
    - "Which records mention a conflicting policy?"
sources:
  - id: records
    kind: local_json
    sample_path: fixtures/records.json
    sample_format: json
    sample_fingerprint: sha256:example
    record_count: 2
record_shapes:
  - source_id: records
    sample_format: json
    sample_fingerprint: sha256:example
    record_count: 2
    fields:
      - name: id
        types: [string]
        count: 2
        frequency: 1.0
        unique_count: 2
        example: REC-1
      - name: summary
        types: [string]
        count: 2
        frequency: 1.0
        unique_count: 2
        example: "Primary record summary."
    candidate_identifier_fields: [id]
    candidate_text_fields: [summary]
ontology_plan:
  library_modules: [extraction]
  subtypes:
    - name: BootstrapRecord
      archetype: artifact
      attrs: [record_id, title, text, source_id]
      searchable_text_fields: [title, text]
      alias_fields: [record_id, title]
    - name: BootstrapFinding
      archetype: observation
      attrs: [finding_id, label, text, source_id]
      searchable_text_fields: [label, text]
narrowing_plan:
  - parent: BootstrapRecord
    edge: contains
    child: BootstrapFinding
  - parent: BootstrapRecord
    edge: references
    child: Document
  - parent: Document
    edge: references
    child: BootstrapRecord
extractor_plan:
  entity_patterns: []
  linker_routes: []
  aliases: []
view_plan:
  views: []
quality_plan:
  invariants: []
  fixture_assertions:
    - name: non_empty_graph
      min_nodes: 1
      min_edges: 1
verification:
  status: verified
  checks:
    - name: source_registry
      status: passed
      stage: source coverage
    - name: catalog_dry_run
      status: passed
      stage: narrowing-trigger acceptance
    - name: publish
      status: passed
      stage: projection
  generation_id: 1
  catalog_version_id: 1
  node_row_delta: 4
  edge_row_delta: 3
  metrics_snapshot:
    dlq_count: 0
  doctor:
    ok: true
  staged_hashes:
    deployment.yaml: sha256:example
  plan_hash: sha256:example
