\* Positive proof that the gate FIX is effective: with the gate's raw-rows arm
\* on (BuggyGateOmitsRawRows = FALSE) the writer and gate stay equivalent even
\* under an incomplete reflexive closure (ReflexiveClosureComplete = FALSE),
\* where the declared (work_item, ...) triple is admitted only by the raw arm.
SPECIFICATION Spec

CONSTANTS
  ReflexiveClosureComplete = FALSE
  BuggyGateOmitsRawRows = FALSE

INVARIANTS
  TypeOK
  WriterGateNarrowingEquivalence
  AllTuplesEquivalent
  InactiveCatalogPermitsAll
  AllowedTriplesUseCatalogSubtypesOnly
