\* Buggy-toggle witness: the pre-fix gate (BuggyGateOmitsRawRows = TRUE) uses the
\* descendant-closure arm ALONE, while the writer keeps its raw-rows arm. Under an
\* incomplete reflexive closure (ReflexiveClosureComplete = FALSE) the declared
\* narrowing triple (work_item, assigned_to, person) is admitted by the writer's
\* raw arm but NOT by the gate's closure -- so the two surfaces disagree and TLC
\* refutes WriterGateNarrowingEquivalence BY NAME. On the main config the closure
\* is complete and the gate keeps its raw arm, so the surfaces agree; this is the
\* latent spurious-publish-block the wave-8 gate fix closes.
SPECIFICATION Spec

CONSTANTS
  ReflexiveClosureComplete = FALSE
  BuggyGateOmitsRawRows = TRUE

INVARIANTS
  WriterGateNarrowingEquivalence
