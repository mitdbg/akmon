  BuggySkipRecordIdRestamp = FALSE
  BuggySkipRevisionRestamp = FALSE
  BuggyForkIdentityLands = TRUE
  BuggyPromoteMarkerLands = FALSE
  BuggyTrustedDefault = FALSE

INVARIANTS
  ForkProvenanceIdentityDoesNotLand
