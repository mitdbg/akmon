SPECIFICATION Spec

\* Buggy toggle ON: the verification gate ignores evidence freshness. TLC
\* must refute the named invariant, proving the entry-freshness guard is
\* load-bearing (wave-1 named-witness rule).
CONSTANTS
  NoFormal = no_formal
  StaleFormal = stale_formal
  FreshFormal = fresh_formal
  BroadAcceptance = broad_acceptance
  SpecificAcceptance = specific_acceptance
  BuggyAdvanceIgnoresFreshness = TRUE
  BuggySweepMissesStale = FALSE

INVARIANTS
  VerificationEnteredFresh
