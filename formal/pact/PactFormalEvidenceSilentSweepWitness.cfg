SPECIFICATION Spec

\* Buggy toggle ON: the corpus sweep runs but stays silent about a stale
\* row. TLC must refute the named invariant, proving the detection half of
\* the contract constrains reachable state.
CONSTANTS
  NoFormal = no_formal
  StaleFormal = stale_formal
  FreshFormal = fresh_formal
  BroadAcceptance = broad_acceptance
  SpecificAcceptance = specific_acceptance
  BuggyAdvanceIgnoresFreshness = FALSE
  BuggySweepMissesStale = TRUE

INVARIANTS
  NoSilentStaleAfterVerification
