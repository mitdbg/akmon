\* Buggy-toggle witness: BuggyOptimizerMutatesBase = TRUE lets a materialization
\* rewrite a base-graph attribute to "mutated", so BaseNodeAttrsPreserved (and the
\* AltheaOptimizerSafetyKernel that conjoins it) is refuted BY NAME. On the main
\* AltheaOptimizerSafety.cfg the toggle is FALSE and Althea's search is additive, so
\* the preservation invariants hold. The load-bearing production proof is the
\* executable checker src/okg/optimizer/formal_search.py (it diffs real before/after
\* node/edge attrs); this witness makes the TLC kernel non-vacuous rather than a
\* guard-restatement.
SPECIFICATION Spec

CONSTANT
  BuggyOptimizerMutatesBase = TRUE

INVARIANTS
  BaseNodeAttrsPreserved
