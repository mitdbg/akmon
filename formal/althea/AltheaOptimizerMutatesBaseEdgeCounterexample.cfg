\* Buggy-toggle witness for the EDGE twin. BuggyOptimizerMutatesBase = TRUE lets a
\* materialization rewrite a base-graph EDGE attribute to "mutated", so
\* BaseEdgeAttrsPreserved is refuted BY NAME. Paired with the node witness
\* (AltheaOptimizerMutatesBaseCounterexample.cfg): TLC halts at the first violated
\* invariant, so each base-preservation twin needs its own config to be witnessed
\* in isolation rather than left an unwitnessed guard-restatement. On the main
\* AltheaOptimizerSafety.cfg the toggle is FALSE and both invariants hold. The
\* load-bearing production proof remains src/okg/optimizer/formal_search.py.
SPECIFICATION Spec

