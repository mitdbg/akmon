\* Focused positive config for the institutional IAM claim family. Each of the
\* eight claim-check failure modes has its OWN otherwise-grantable postgres
\* external-claim read request (scoped, authorized, trusted where applicable,
\* subject-bound, granted) so exactly one check blocks it -- no other failure
\* mode or authorization layer masks it. postgresRead is the valid positive
\* control that proves the grant path (so the *CannotGrant invariants are not
\* vacuously satisfied by an everything-denied world). This isolates the IAM
\* invariants without multiplying them against the full control-plane request
\* zoo in Nomos.cfg; each of the eight buggy-toggle witnesses skips exactly one
\* check on this same universe.
\*
\* unverifiedSsoRead is the issue #1007 arm: a claim carrying no verification
\* evidence. It is deliberately trusted, scoped, authorized, subject-bound,
\* and granted, so the ONLY thing that can block it is the unverified check.
