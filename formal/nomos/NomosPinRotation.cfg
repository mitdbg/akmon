\* Focused positive config for the publish-pin contract: the bundle universe
\* is 2 with RotateBundle enabled and two generations, over a MINIMAL request
\* universe (the config-change admin request only). This is where
\* GenerationPinMatchesPublishBundle is proven DISTINGUISHING -- a generation
\* published under bundle1 keeps its pin across a rotation to bundle2, and a
\* second publish pins bundle2 -- without multiplying the full request zoo in
\* Nomos.cfg by the rotation machinery. The two pin witnesses
\* (NomosStalePinPublishCounterexample.cfg, NomosRotationRestampCounterexample.cfg)
\* flip one Buggy* toggle each on this same universe.
