SPECIFICATION Spec

CONSTRAINT StateConstraint

\* Non-vacuity check for ClaimEvidenceDoesNotPersistSecret.
\* Identical to Nomos.cfg except that the buggy claim-acceptance path is
\* enabled (BuggySecretPersistence = TRUE) and the input set names a real
\* secret-bearing claim (validCernClaim). On this configuration the
\* PersistSecretEvidenceBug action is reachable, so persistedSecretEvidence
\* becomes non-empty and TLC must report that
\* ClaimEvidenceDoesNotPersistSecret is violated. The safe config (Nomos.cfg)
\* keeps the flag FALSE, the action disabled, and the invariant true.
