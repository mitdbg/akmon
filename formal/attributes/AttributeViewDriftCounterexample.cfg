SPECIFICATION Spec

\* Buggy-toggle witness: MaintainView marks the view fresh WITHOUT copying
\* `effective`, so a view that already lags truth is served as current. TLC must
\* refute ViewMatchesEffectiveWhenFresh by name via a reachable stale-view trace
\* (record/accept -> MaintainView -> supersede [view now behind] -> buggy
\* MaintainView [claims fresh, no copy]). The positive AttributeState config with
\* BuggyViewMaintenanceSkipsCopy = FALSE keeps it green.
CONSTANTS
    NodeAttr = NodeAttr
    EdgeAttr = EdgeAttr
    Attrs = {NodeAttr, EdgeAttr}
    NodeAttrs = {NodeAttr}
    EdgeAttrs = {EdgeAttr}
    ValueA = ValueA
    ValueB = ValueB
    Values = {ValueA, ValueB}
    Obs1 = Obs1
    Obs2 = Obs2
    Observations = {Obs1, Obs2}
    NoObservation = NoObservation
    Inspect = Inspect
    Query = Query
    ReadSurfaces = {Inspect, Query}
    NoReadSurface = NoReadSurface
    PromotableAttrs = {NodeAttr}
    ReservedAttrs = {EdgeAttr}
    BuggyViewMaintenanceSkipsCopy = TRUE

INVARIANTS
    ViewMatchesEffectiveWhenFresh
