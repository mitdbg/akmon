\* Counterexample (a): the reuse step's durability marker is written BEFORE its
\* effects are durable (MarkerBeforeEffects = TRUE) -- the effects sit in the
\* open transaction while the marker lands immediately. A crash then loses the
\* transaction but keeps the marker; on resume DBOS does NOT re-execute the
\* marker-complete step (its recorded result is replayed, its transactional
\* effects are NOT re-created), so the workflow reaches the commit with no
\* certificates in the buffer and checkpoints a generation WITHOUT them.
\* Refutes NoPartialGenerationObservable BY NAME. On the positive
\* DbosCommitResume.cfg the marker rides the commit transaction and the
\* invariant holds -- proving marker-no-earlier-than-effects is load-bearing.
\*
\* One-line violating shape: Derive -> Reuse(buffer certs, marker durable) ->
\* Crash(buffer lost) -> Resume -> Derive -> Reuse SKIPPED (marker) -> Admit ->
\* CommitAtomic -> done /\ visible /\ dur["certs"] = NoContent.
\*
\* The config declares ONE invariant (the one it refutes); TLC halts at the
\* first violation, so a bundled config could only ever demonstrate one.
SPECIFICATION Spec

CONSTANTS
  NumGens = 1
  MaxAttempts = 3
  MarkerBeforeEffects = TRUE
  SplitCommitTxn = FALSE
  NonIdempotentEffects = FALSE

INVARIANTS
  NoPartialGenerationObservable
