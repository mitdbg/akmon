\* Exhaustive small-scope positive config for the reuse pass (this IS the smoke
\* model -- the state space is small enough for full TLC exhaustion). Both guards
\* are set to their SOUND value; resolved-state equality holds on every behavior.
SPECIFICATION Spec

CONSTANTS
  BaseSteps = {"p", "q"}
  Spawner = "p"
  Consumer = "c"
  DepClasses = {"input", "envelope", "precedence"}
  StaleClass = "precedence"
  GuardDynamicConsumer = TRUE
  CertIgnoresStaleClass = FALSE

INVARIANTS
  TypeOK
  NoOmittedConsumer
  SkippedOutputsUnchanged
  ResolvedStateEquality
  ReusePassSoundness
