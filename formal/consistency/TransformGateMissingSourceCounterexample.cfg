\* Issue #1151 witness: the historical runtime joined only e.dst to live nodes.
\* A missing-source edge is in the sound candidate scope, but the one-sided
\* evaluator reports it clean and refutes the source-endpoint invariant by name.
SPECIFICATION MissingSourceWitnessSpec

CONSTANTS
  Edges = {"edge_new", "edge_incident", "edge_clean"}
  Nodes = {"node_topology", "node_additive", "node_clean"}
  FallbackReasons = {"none"}
  BuggyTrustsUnsoundDelta = FALSE
  BuggyChecksOnlyDestination = TRUE

INVARIANTS
  MissingSourceEndpointCannotPublish
