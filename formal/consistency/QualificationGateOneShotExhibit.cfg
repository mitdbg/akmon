\* EXHIBIT (checks-as-violation): under BlockOn = "new_findings" the standing
\* predicate NoPublishWhileMandatoryOpen is VIOLATED by the one-shot-mandatory
\* ratchet. A single high-severity finding (floor 0, so it qualifies) opens at
\* attempt N -- newly-observed, so the gate blocks. At attempt N+1 the finding
\* is still open but UNCHANGED, so bounded-event-growth emits NO re-observed
\* event; the newly-opened set is empty and the gate PUBLISHES over the same
\* open mandatory finding. TLC's shortest counterexample is exactly that
\* two-cycle ratchet. This is the paper's point: only any_open implements the
\* standing qualification; new_findings blocks a mandatory finding exactly once
\* and then publishes it as backlog.
\*
\* The config declares ONE invariant (the one it refutes); TLC halts at the
\* first violation, so a bundled config could only ever demonstrate one.
SPECIFICATION Spec

CONSTANTS
  Findings = {"f_high"}
  MaxCycles = 3
  BlockOn = "new_findings"
  MinSeverityRank = 0
  BuggyConsultsNewlyOpenedForStanding = FALSE

INVARIANTS
  NoPublishWhileMandatoryOpen
