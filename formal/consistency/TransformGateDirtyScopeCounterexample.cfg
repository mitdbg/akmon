\* Buggy-toggle witness: BuggyTrustsUnsoundDelta = TRUE relaxes the
\* DeltaEvidenceSound Init precondition, so the model may start from an unsound
\* delta where an invalid post-edge (rejected/missing-endpoint AND still live)
\* sits OUTSIDE the dirty scope. Under scoped selection (fallbackReason = none)
\* that edge escapes candidateEdges, EvaluateCandidates sets blocksPublish=FALSE
\* while InvalidPostEdges is non-empty, and NoInvalidPostEdgePublishes is refuted
\* BY NAME. On the positive TransformGateDirtyScope.cfg the toggle is FALSE and
\* the guard holds -- proving DeltaEvidenceSound is load-bearing, not decorative.
SPECIFICATION UnsoundDeltaEdgeWitnessSpec

CONSTANTS
  Edges = {"edge_new", "edge_incident", "edge_clean"}
  Nodes = {"node_topology", "node_additive", "node_clean"}
  FallbackReasons = {"none"}
  BuggyTrustsUnsoundDelta = TRUE
  BuggyChecksOnlyDestination = FALSE

INVARIANTS
  NoInvalidPostEdgePublishes
