\* Counterexample (the point of this spec): GuardConsultsRetryState = FALSE
\* removes the last_status consultation from the generation-level
\* no-op-reuse predicate -- the pre-P6 dev defect (the publisher no-op fast
\* path bypassing the retry guarantee). TLC MUST refute the temporal
\* property EveryItemEventuallyProcessed with the stranded-watermark lasso:
\*
\*   Init (items delivered, delta pending)
\*   -> RunEnrichersStage: an item's LLM call fails -- input failure
\*      recorded, run incomplete, last_status = 'failed', watermark held,
\*      delta consumed
\*   -> the source stays permanently quiescent (no SourceWrite ever again;
\*      the source is unfair by design)
\*   -> every later publish cycle takes the no-op-reuse fast path and puts
\*      'enrichers' in skipped_stages (SkipEnrichersStage, a self-loop) --
\*      the held item is never retried. TLC reports the lasso as the finite
\*      prefix above followed by stuttering in the stranded state.
\*
\* Same fair Spec as the positive config -- only the guard constant differs
\* -- so the guard, not the fairness, is the load-bearing difference. This
\* is a TEMPORAL-property refutation ("Temporal properties were violated"),
\* checked in-process by scripts/check_formal_watermark_retry.py; the
\* suite's DIRECT_COUNTEREXAMPLES registry keys on named INVARIANT
\* violations and cannot express it.
SPECIFICATION Spec

CONSTANTS
  Items = {"i1", "i2"}
  MaxTransientFailures = 2
  GuardConsultsRetryState = FALSE

PROPERTIES
  EveryItemEventuallyProcessed
