\* Falsifiability witness for the standing invariant: BuggyConsultsNewlyOpenedForStanding
\* = TRUE makes an any_open gate consult the NEWLY-OPENED count instead of the
\* OPEN count -- the wrong count. That silently degrades any_open into the
\* new_findings one-shot ratchet: the finding opens at attempt N (blocks,
\* newly-observed), then at N+1 stays open without a re-observed event and the
\* buggy gate PUBLISHES over it, refuting NoPublishWhileMandatoryOpen by name.
\* On the positive QualificationGateStanding.cfg the toggle is FALSE and any_open
\* blocks on the open count, so the invariant holds -- proving the open-count
\* consultation is load-bearing, not decorative.
\*
\* One declared invariant; TLC halts at the first violation.
SPECIFICATION Spec

CONSTANTS
  Findings = {"f_high"}
  MaxCycles = 3
  BlockOn = "any_open"
  MinSeverityRank = 0
  BuggyConsultsNewlyOpenedForStanding = TRUE

INVARIANTS
  NoPublishWhileMandatoryOpen
