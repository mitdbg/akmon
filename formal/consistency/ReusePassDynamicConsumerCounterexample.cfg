\* Counterexample (a): the dynamic-consumer guard is DISABLED
\* (GuardDynamicConsumer = FALSE). A step whose RUN would spawn a NEW consumer
\* (spawnActive) is now skippable behind an ordinary unchanged-inputs certificate
\* -- the Spawner's OWN recorded classes are clean, so CertMatch admits the skip.
\* The new consumer is never reached, its contribution is omitted, and the
\* committed incremental state diverges from the full recompute. Refutes
\* NoOmittedConsumer BY NAME. On the positive ReusePass.cfg the guard is TRUE and
\* the invariant holds -- proving the guard is load-bearing, not decorative.
\*
\* One-line violating shape: Init(spawnActive=TRUE, p clean) -> SkipStep("p") ->
\* {decide "q"} -> Commit -> committed /\ spawnActive /\ "c" \notin reached.
SPECIFICATION Spec

CONSTANTS
  BaseSteps = {"p", "q"}
  Spawner = "p"
  Consumer = "c"
  DepClasses = {"input", "envelope", "precedence"}
  StaleClass = "precedence"
  GuardDynamicConsumer = FALSE
  CertIgnoresStaleClass = FALSE

INVARIANTS
  NoOmittedConsumer
