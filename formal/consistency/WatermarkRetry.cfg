\* Positive liveness config (this IS the smoke model -- the scope is small
\* enough for full TLC exhaustion, and TLC checks the temporal PROPERTY
\* under the fair Spec). GuardConsultsRetryState = TRUE models the P6 engine:
\* the generation-level no-op-reuse fast path refuses to skip the enrichers
\* stage while any enricher's last_status != 'success'. Under weak fairness
\* on publish cycles and a bounded transient-failure budget, every item --
\* including one whose LLM call failed and whose watermark is held -- is
\* eventually processed.
SPECIFICATION Spec

CONSTANTS
  Items = {"i1", "i2"}
  MaxTransientFailures = 2
  GuardConsultsRetryState = TRUE

INVARIANTS
  TypeOK
  HeldWatermarkImpliesPendingInput

PROPERTIES
  EveryItemEventuallyProcessed
