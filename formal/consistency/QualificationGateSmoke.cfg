\* Smoke / sanity profile: BlockOn = "never" with the deployment override
\* ranging over {unset, force, advisory} and a mixed-severity ledger. Checks
\* the policy-independent sanity invariants -- never blocks on findings, force
\* always blocks, advisory always publishes -- NOT the standing predicate
\* (never legitimately publishes over open findings, so NoPublishWhileMandatoryOpen
\* does not belong here). Operational blocks are out of scope.
SPECIFICATION Spec

CONSTANTS
  Findings = {"f_high", "f_low"}
  MaxCycles = 3
  BlockOn = "never"
  MinSeverityRank = 1
  BuggyConsultsNewlyOpenedForStanding = FALSE

INVARIANTS
  TypeOK
  NeverPolicyNeverBlocksOnFindings
  OverrideForceBlocksWhenDecided
  OverrideAdvisoryPublishesWhenDecided
