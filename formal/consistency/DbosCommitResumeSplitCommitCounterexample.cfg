\* Counterexample (b): the atomic commit set lands in TWO transactions instead
\* of one (SplitCommitTxn = TRUE) -- the certificate / claim / projection
\* stores commit first, the generation checkpoint (with visibility and the
\* step markers) second. A crash between the two strands durable certificate
\* rows referencing a generation whose checkpoint never committed. Refutes
\* NoCertWithoutCheckpoint BY NAME. On the positive DbosCommitResume.cfg the
\* single-transaction commit (commit_maintenance_state: one conn.commit()
\* lands certificates and checkpoint together) makes the stranded state
\* unreachable -- proving the one-transaction boundary is load-bearing, not
\* decorative.
\*
\* One-line violating shape: Derive -> Reuse -> Admit -> CommitSplitHead
\* (certs durable) -> Crash -> crashed /\ dur["certs"] # NoContent /\
\* dur["checkpoint"] = NoContent.
\*
\* The config declares ONE invariant (the one it refutes); TLC halts at the
\* first violation, so a bundled config could only ever demonstrate one.
SPECIFICATION Spec

CONSTANTS
  NumGens = 1
  MaxAttempts = 3
  MarkerBeforeEffects = FALSE
  SplitCommitTxn = TRUE
  NonIdempotentEffects = FALSE

INVARIANTS
  NoCertWithoutCheckpoint
