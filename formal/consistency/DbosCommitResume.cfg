\* Exhaustive small-scope positive config for the DBOS commit/resume protocol
\* (this IS the smoke model -- the state space is small enough for full TLC
\* exhaustion). Every hazard toggle is at its SOUND value: effects are
\* transactional and input-deterministic, markers ride the commit transaction,
\* and the commit set lands in one transaction. Two successive publish cycles;
\* each cycle's delta (what each step writes) ranges over the full two-value
\* alphabet per store, and a crash may hit every step boundary with up to
\* MaxAttempts executions per cycle. All three crash-atomicity invariants hold
\* on every behavior.
SPECIFICATION Spec

CONSTANTS
  NumGens = 2
  MaxAttempts = 4
  MarkerBeforeEffects = FALSE
  SplitCommitTxn = FALSE
  NonIdempotentEffects = FALSE

INVARIANTS
  TypeOK
  NoPartialGenerationObservable
  NoDoubleCommit
  NoCertWithoutCheckpoint
  DbosCommitResumeSoundness
