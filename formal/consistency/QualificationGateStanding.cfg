\* Standing-invariant profile: BlockOn = "any_open" -- the only policy that
\* implements Concord's standing qualification. NoPublishWhileMandatoryOpen must
\* hold EXHAUSTIVELY over the finding lifecycle x override x mixed-severity
\* scope: any_open blocks on every open finding, so a generation never
\* publishes while a mandatory (floored-open) finding stands. Override ranges
\* over {unset, force, advisory}; the invariant holds under all three (advisory
\* demotes everything to non-mandatory, force never publishes, unset blocks on
\* open). The override-sanity invariants ride along as cross-checks.
SPECIFICATION Spec

CONSTANTS
  Findings = {"f_high", "f_low"}
  MaxCycles = 3
  BlockOn = "any_open"
  MinSeverityRank = 1
  BuggyConsultsNewlyOpenedForStanding = FALSE

INVARIANTS
  TypeOK
  NoPublishWhileMandatoryOpen
  OverrideForceBlocksWhenDecided
  OverrideAdvisoryPublishesWhenDecided
