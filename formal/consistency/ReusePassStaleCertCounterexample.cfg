\* Counterexample (b): a certificate is accepted despite ONE stale dependency
\* class (CertIgnoresStaleClass = TRUE drops StaleClass = "precedence" from the
\* validity check). A step whose precedence fact actually changed still validates,
\* so the ladder admits a skip; the carried-forward (clean) output differs from
\* the fresh output, and the committed incremental state diverges from the full
\* recompute. Refutes SkippedOutputsUnchanged BY NAME. On the positive
\* ReusePass.cfg the check consults every class and the invariant holds -- proving
\* the completeness of validate_certificate's per-class comparison is load-bearing
\* (cf. tests/substrate/consistency/test_reuse_scheduler.py::
\* test_policy_and_precedence_fingerprint_changes_force_the_step_to_run).
\*
\* One-line violating shape: Init(q dirty only on "precedence") -> SkipStep("q")
\* -> {decide "p"} -> Commit -> committed /\ decided["q"]="skip" /\ q output moved.
SPECIFICATION Spec

CONSTANTS
  BaseSteps = {"p", "q"}
  Spawner = "p"
  Consumer = "c"
  DepClasses = {"input", "envelope", "precedence"}
  StaleClass = "precedence"
  GuardDynamicConsumer = TRUE
  CertIgnoresStaleClass = TRUE

INVARIANTS
  SkippedOutputsUnchanged
