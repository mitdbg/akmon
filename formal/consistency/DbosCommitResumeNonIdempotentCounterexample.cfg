\* Counterexample (c): the non-idempotent hazard (NonIdempotentEffects = TRUE)
\* -- the reuse step writes its certificates durably OUTSIDE the transactional
\* commit, with content derived from the attempt counter (a timestamp-like
\* escape from determinism). A crash before the marker makes resume re-execute
\* the step, which durably overwrites the same generation's certificates with
\* DIFFERENT content: the same generation is committed twice with different
\* bytes. Refutes NoDoubleCommit BY NAME. On the positive DbosCommitResume.cfg
\* effects are transactional (a lost attempt leaves nothing durable) and
\* deterministic (a re-execution reproduces the same bytes -- the engine's
\* byte-equal ReusePassResult digest claim), so the invariant holds -- proving
\* BOTH halves of that discipline are load-bearing against a step that writes
\* outside the commit transaction.
\*
\* One-line violating shape: Derive -> Reuse(dur["certs"] = 1, out of txn) ->
\* Crash -> Resume(attempt 2) -> Derive -> Reuse re-executes (no marker) ->
\* dur["certs"] = 2 # firstDur["certs"] = 1, caught at the next observable
\* state.
\*
\* The config declares ONE invariant (the one it refutes); TLC halts at the
\* first violation, so a bundled config could only ever demonstrate one.
SPECIFICATION Spec

CONSTANTS
  NumGens = 1
  MaxAttempts = 3
  MarkerBeforeEffects = FALSE
  SplitCommitTxn = FALSE
  NonIdempotentEffects = TRUE

INVARIANTS
  NoDoubleCommit
