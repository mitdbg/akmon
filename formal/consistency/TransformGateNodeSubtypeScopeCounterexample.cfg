\* Buggy-toggle witness: BuggyTrustsUnsoundDelta = TRUE relaxes the
\* DeltaEvidenceSound precondition, so an invalid-subtype node may sit OUTSIDE
\* the dirty scope. Under scoped selection (fallbackReason = none) the candidate
\* set is just dirtyNodes, the invalid node escapes, blocksPublish stays FALSE
\* while invalidSubtypeNodes is non-empty, and NoInvalidPostNodePublishes is
\* refuted BY NAME. On the positive TransformGateNodeSubtypeScope.cfg the toggle
\* is FALSE and the guard holds.
SPECIFICATION Spec

CONSTANTS
  BuggyTrustsUnsoundDelta = TRUE

INVARIANTS
  NoInvalidPostNodePublishes
