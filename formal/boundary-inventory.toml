rationale = "Issue #713: EnricherBacklogDrain.tla exhausts a finite two-stage acyclic enricher DAG under weak fairness and a publisher phase-start node-fact snapshot. It proves EveryEligibleInputEventuallyProcessed and ReuseOnlyWhenNoEligibleBacklog when both generation-reuse decisions consult successful progress watermark lag. The pre-reuse guard-off config exhibits a temporal lasso that strands the upstream-derived fact after source traffic becomes quiescent. The post-reuse guard-off config independently violates the named safety invariant when graph-idempotent upstream work creates lag after the phase-start snapshot. Deliberate bounds: one upstream input, one downstream stage, finite quiescent source input, node-fact selectors only, and no payload semantics. Runtime tests retain authority for subtype filtering, retention-stale progress, retractions, selectorless declarations, and graph-visible published generations. Edge-only prior-segment backlog is explicitly out of scope because the current incremental context cannot reconstruct historical edge facts."

