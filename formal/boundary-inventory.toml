rationale = "formalize-differential-core (task.formal.reuse-model): ReusePass.tla exhausts an 850-state small-scope model of the reuse worklist -- a delta dirties some inputs; each reached step attempts the skip ladder (valid-prior-certificate / degenerate unchanged-inputs / bounded-dominance / run) and commits at the fixed point -- and proves the committed resolved state equals a full recompute of the same delta on every behavior. Two guards are witnessed load-bearing by name: ReusePassDynamicConsumerCounterexample.cfg (GuardDynamicConsumer=FALSE) refutes NoOmittedConsumer when a step whose run would spawn a new consumer is skipped, and ReusePassStaleCertCounterexample.cfg (CertIgnoresStaleClass=TRUE) refutes SkippedOutputsUnchanged when a certificate validates despite one stale dependency class. Deliberate abstractions keep the model small and are runtime-test/claim-core boundaries, not accidental proof: the ten DEPENDENCY_CLASSES are reduced to three representative ones; a step's output is the identity on its recorded facts, so the bounded-dominance authority arithmetic (dominance_is_justifiable / derive_competitor_bound) is NOT exercised here (it is proven by the claim-core precedence model and the scheduler's dominance tests); the new-consumer trigger is modeled independent of the spawner's recorded classes (the section-9 hole) but the possible-effects reach computation itself is not proven; and the discard/abort fallbacks plus the DBOS crash/resume atomicity (coordination-dbos scope) are out of scope for this equality invariant."

