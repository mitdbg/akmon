]
rationale = "formalize-differential-core (task.formal.qualification-model): QualificationGate.tla exhausts a small-scope model (159 distinct states on the positive scope) of the finding-blocking arm of evaluate_consistency_publish_gate -- the finding lifecycle (absent -> open via an observed event -> resolved -> reopened) crossed with the declarative blocking policy (never / new_findings [+ severity floor] / any_open) and a deployment blocks_publish override, across consecutive publish attempts where a blocked attempt retries. It rules on the new_findings one-shot-mandatory semantics: QualificationGateStanding.cfg proves NoPublishWhileMandatoryOpen (Concord's standing qualification predicate) holds exhaustively under any_open; QualificationGateOneShotExhibit.cfg exhibits the reachable violation under new_findings -- a mandatory finding opens (blocks, newly-observed), then on the next attempt emits no re-observed event (bounded-event-growth, the _newly_opened_this_run contract) and publishes over itself as backlog -- proving only any_open implements the standing qualification. The falsifiability witness QualificationGateStandingCounterexample.cfg (BuggyConsultsNewlyOpenedForStanding=TRUE) refutes NoPublishWhileMandatoryOpen by name when an any_open gate consults the newly-opened count instead of the open count, proving the open-count consultation is load-bearing. Deliberate abstractions that stay runtime-test evidence, not accidental proof: operational blocks (timeout / error / incomplete coverage), which the engine always treats as blocking, are out of scope (finding arm only); the observation-ledger SQL and the backpressure probing breaker are unmodeled; and the three-level severity lattice is abstracted to a per-config qualifying/non-qualifying partition at the declared floor. The section-9.10 operator ruling recorded from this model output is manual evidence produced by the orchestrator, outside the spec."

[[direct_models]]
id = "consistency.dbos_commit_resume"
area = "consistency"
title = "Publish commit/resume crash atomicity under the DBOS workflow"
owner_surface = "formal/consistency/README.md; src/okg/substrate/runtime/reuse_pass_workflow.py"
model_refs = [
  "formal/consistency/README.md",
  "formal/consistency/DbosCommitResume.tla",
  "formal/consistency/DbosCommitResume.cfg",
  "formal/consistency/DbosCommitResumeMarkerFirstCounterexample.cfg",
  "formal/consistency/DbosCommitResumeSplitCommitCounterexample.cfg",
  "formal/consistency/DbosCommitResumeNonIdempotentCounterexample.cfg",
]
evidence_refs = [
  "scripts/check_formal_dbos_commit.py",
  "src/okg/substrate/runtime/reuse_pass_workflow.py",
  "src/okg/substrate/publisher/publisher.py",
  "tests/substrate/consistency/test_reuse_scheduler.py",
]
rationale = "formalize-differential-core (task.formal.coordination-dbos, delivering the commit/resume territory of the formal-strengthening umbrella's open coordination-dbos wave, which remains open for its broader native-coordination scope): DbosCommitResume.tla exhausts a 2944-state small-scope model of the publish commit/resume protocol -- a workflow of ordered steps (derive -> reuse -> admit -> commit-checkpoint) with durable DBOS step-completion markers, a crash allowed at every step boundary (the open transaction is lost, durable state survives), and resume restarting the workflow with marker-complete steps NOT re-executed (DBOS replays the recorded result without re-creating transactional effects), over two successive publish cycles with per-cycle delta inputs ranged. Three invariants hold on every behavior of the sound configuration: NoPartialGenerationObservable (the visible pointer only ever reaches a fully-committed generation), NoDoubleCommit (resume never commits the same generation twice with different content -- effects are transactional AND input-deterministic), and NoCertWithoutCheckpoint (no durable certificate references a generation whose checkpoint never committed). Three guards are witnessed load-bearing by name: DbosCommitResumeMarkerFirstCounterexample.cfg (a step's durability marker written BEFORE its effects are durable -- resume skips the step and the commit checkpoints a partial generation), DbosCommitResumeSplitCommitCounterexample.cfg (the one-transaction commit set split in two -- a crash between them strands certificates for an uncommitted generation), and DbosCommitResumeNonIdempotentCounterexample.cfg (a non-idempotent step writing outside the commit transaction -- resume re-executes and double-commits different content). The commit_maintenance_state single conn.commit() (certificates atomic with the generation checkpoint, markers riding the DBOS same-database boundary) is the modeled sound protocol; the crash-mid-update pytest witness is the single-trace empirical anchor the model generalizes. Deliberate abstractions documented in the folder README: the reuse-pass discard/abort fallback ladder and the blocked-publish path are out of scope; durable-store invariants are asserted at observable states (crash boundaries and termination); the live-DBOS singleton wiring (a step rebuilding effects from serializable identity) remains task.reuse.live-proof scope -- this model pins the marker-no-earlier-than-effects constraint that wiring must satisfy."

[[direct_models]]
id = "consistency.watermark_retry"
area = "consistency"
title = "Watermark-hold retry liveness under publish-cycle skip paths (differential core)"
owner_surface = "formal/consistency/README.md; src/okg/substrate/publisher/publisher.py"
model_refs = [
  "formal/consistency/README.md",
  "formal/consistency/WatermarkRetry.tla",
  "formal/consistency/WatermarkRetry.cfg",
  "formal/consistency/WatermarkRetryStrandedCounterexample.cfg",
]
evidence_refs = [
  "scripts/check_formal_watermark_retry.py",
  "src/okg/substrate/library/enrichers/extraction/base.py",
  "src/okg/substrate/publisher/publisher.py",
  "tests/substrate/test_enricher_input_failure_holds_watermark.py",
  "tests/substrate/extraction/test_extractor_llm_failure_watermark.py",
  "tests/substrate/runtime/test_publish_commit_protocol.py",
]
rationale = "formalize-differential-core (task.formal.watermark-liveness): WatermarkRetry.tla composes the per-item extractor record-and-hold contract (a failed LLM call records an input failure, the run comes back incomplete, the publisher stamps last_status='failed:...' and holds the enricher watermark) with the publisher's two skip paths -- the per-enricher skip-clean rung that refuses whenever last_status != 'success', and the generation-level no-op-reuse fast path that can put 'enrichers' in skipped_stages on a source-quiescent cycle. The headline is a LIVENESS theorem checked by TLC as a temporal property (19 distinct states, complete state space): under weak fairness on publish cycles, with the fast path consulting retry state (GuardConsultsRetryState=TRUE) and failure transient (a bounded budget -- a retried item eventually succeeds), every failed-and-held item is eventually processed (EveryItemEventuallyProcessed). WatermarkRetryStrandedCounterexample.cfg (GuardConsultsRetryState=FALSE) refutes the SAME property under the SAME fair spec with the stranded-watermark lasso -- item fails, source goes permanently quiescent, no-op-reuse skips the enrichers stage forever -- pinning the pre-P6 dev defect class mechanically (the temporal refutation is checked in-process by the checker; the suite's named-invariant witness registry cannot express it). The live engine HAS the generation-level guard (P6 of specify-publish-commit-protocol: _enricher_retry_pending_name invalidates reuse as 'enricher_retry_pending'; pinned by test_p6_held_enricher_retry_invalidates_reuse and test_p6_never_run_enricher_is_pending). Deliberate abstractions that stay runtime-test evidence: the transient-failure budget is global and bounded, so a permanently failing (poison) item is out of scope; the reuse closure's other invalidation arms (catalog version, lenses, nomos pin, gate inputs, native views, extractor signature) are collapsed into the quiescence test; one enricher, no fact-id arithmetic (the watermark is abstracted to last_status + the pending set); replay-mode exclusions are different bookkeeping, not modeled."

