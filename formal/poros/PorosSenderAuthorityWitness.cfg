\* Buggy-toggle witness over the base PorosExchange model: BuggySenderHintGrantsAllow
\* = TRUE lets a sender-hinted, receiver-UNauthorized message (hintOnlyMsg -- in
\* SenderHintMessages, not in ReceiverAuthorizedMessages, not in
\* PromotionAuthorizedMessages) receive a Nomos "allow" and be admitted, refuting
\* NoSenderPolicyAuthority BY NAME. On the positive PorosExchange.cfg the toggle is
\* FALSE and the invariant holds. This is the runtime hazard wave 7 closes: the
\* refinement now derives receiver_authorized from the real Nomos decision, so a
\* sender hint can no longer stand in for receiver authorization.
SPECIFICATION Spec

CONSTANTS
  Messages = {
    publicMsg,
    hintOnlyMsg,
    detachedMsg,
    badObjectMsg,
    privateMsg
  }
  Rows = {rowA, rowB, rowC}
  SenderGeneration = senderGen1
  ReceiverGenerations = {receiverGen1}
  NoGeneration = NoGeneration
  NoMessage = NoMessage
  TrustedMessages = {
    publicMsg,
    hintOnlyMsg,
    detachedMsg,
    badObjectMsg,
    privateMsg
  }
  SignatureValidMessages = {
    publicMsg,
    hintOnlyMsg,
    detachedMsg,
    badObjectMsg,
    privateMsg
  }
  RecipientValidMessages = {
    publicMsg,
    hintOnlyMsg,
    detachedMsg,
    badObjectMsg,
    privateMsg
  }
  BodyHashValidMessages = {
    publicMsg,
    hintOnlyMsg,
    detachedMsg,
    badObjectMsg,
    privateMsg
  }
  FreshMessages = {
    publicMsg,
    hintOnlyMsg,
    detachedMsg,
    badObjectMsg,
    privateMsg
  }
  DetachedMessages = {detachedMsg, badObjectMsg}
  ObjectHashValidMessages = {detachedMsg}
  ReceiverAuthorizedMessages = {publicMsg, detachedMsg}
  PromotionAuthorizedMessages = {privateMsg}
  ReviewMessages = {privateMsg}
  QuarantineMessages = {hintOnlyMsg}
  SenderHintMessages = {hintOnlyMsg}
  RestrictedMessages = {privateMsg}
  PrivateMessages = {privateMsg}
  RedactionEvidenceMessages = {privateMsg}
  DeclassificationEvidenceMessages = {}
  BuggySenderHintGrantsAllow = TRUE

INVARIANTS
  NoSenderPolicyAuthority
