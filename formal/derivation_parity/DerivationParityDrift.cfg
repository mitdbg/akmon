SPECIFICATION Spec

\* Trace-based drift witness. base and kept start equal (InitialBase, no
\* initial-state mismatch); BuggyIncrementalMissesClose makes the incremental
\* fold open a new interval without closing the old one, so kept double-counts
\* the prior contribution and diverges from the batch recompute only after a
\* second delta. TLC must refute IncrementalEqualsBatchForLinearDerivation by
\* name via that reachable sequence of steps.
CONSTANTS
    ItemA = ItemA
    ItemB = ItemB
    Items = {ItemA, ItemB}
    InitialBase = 0
    BuggyIncrementalMissesClose = TRUE

INVARIANTS
    IncrementalEqualsBatchForLinearDerivation
