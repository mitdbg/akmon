\* Buggy-toggle witness for the pin-freeze headline. With
\* BuggySessionFollowsLatest = TRUE a session's graph read follows the LATEST
\* generation instead of its frozen checkout pin: OpenSession pins g1,
\* PublishNext advances latest to g2, and GraphRead then observes
\* graphReadGeneration = g2 # sessionPin = g1, so TLC refutes
\* GraphReadUsesPinnedGeneration BY NAME. On the main ChronosReadPin.cfg the
\* toggle is FALSE and the read stays on sessionPin -- proving the pin-freeze
\* headline is load-bearing rather than structurally true (no action otherwise
\* moves a session's read off its pin).
SPECIFICATION Spec

CONSTANT
  BuggyDefaultZeroFallback = FALSE
  BuggySessionFollowsLatest = TRUE

INVARIANTS
  GraphReadUsesPinnedGeneration
