\* Non-vacuity witness for OperationalSqlNeverDefaultsGeneration.
\* With BuggyDefaultZeroFallback = TRUE, OperationalSql can emit the forbidden
\* uses_default_zero outcome (the int(0)-fallback authority bug production
\* run_sql.py guards against). TLC must report this invariant violated, proving
\* the main-config invariant is load-bearing rather than vacuously true over an
\* unreachable value.
SPECIFICATION Spec

CONSTANT
  BuggyDefaultZeroFallback = TRUE
  BuggySessionFollowsLatest = FALSE

INVARIANTS
  OperationalSqlNeverDefaultsGeneration
