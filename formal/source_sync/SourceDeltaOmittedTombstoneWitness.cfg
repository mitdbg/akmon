SPECIFICATION Spec

\* Buggy toggle ON: the diff drops the scope-derived tombstones. TLC must
\* refute the named invariant, proving completeness is carried by the
\* full-prior-set diff, not vacuously true (wave-1 named-witness rule).
CONSTANTS
  BuggyOmitTombstone = TRUE
  BuggySkipRetractionCanonicalize = FALSE
  BuggyRetractionsAfterInserts = FALSE

INVARIANTS
  RetractionsAreComplete
