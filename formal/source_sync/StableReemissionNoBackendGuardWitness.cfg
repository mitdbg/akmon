SPECIFICATION Spec

\* Keep the graph filter enabled. A direct interval caller bypasses it, so
\* disabling only the backend guard must still reproduce unbounded versioning.
CONSTANTS
  BuggyWorktreeMembership = FALSE
  BuggyRunRevision = FALSE
  GraphNoopGuard = TRUE
  BackendNoopGuard = FALSE
  NonClobberSubstitute = TRUE

INVARIANTS
  DuplicateStableWakeupsDoNotVersion
