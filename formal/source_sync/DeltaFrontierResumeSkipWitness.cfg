SPECIFICATION Spec

\* Buggy toggle ON: a crash-resume marks chronos applied without applying
\* the pending delta — the frontier-skip hazard. TLC must refute the named
\* invariant.
CONSTANTS
  BuggyNewDeltaKeepsReadiness = FALSE
  BuggyResumeSkipsChronos = TRUE

INVARIANTS
  ChronosNeverClaimsUnappliedDelta
