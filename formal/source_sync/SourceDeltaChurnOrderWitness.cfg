SPECIFICATION Spec

\* Buggy toggle ON: retractions replay after the run's inserts, so alias
\* churn leaves a trailing tombstone on a live record. TLC must refute the
\* named invariant.
CONSTANTS
  BuggyOmitTombstone = FALSE
  BuggySkipRetractionCanonicalize = FALSE
  BuggyRetractionsAfterInserts = TRUE

INVARIANTS
  ChurnKeepsRecordLive
