# Relationships the generator does NOT write: the deployment's own enrichers
# derive them during the publish from attributes the generator plants. These
# land in the fact log (okg.edge_facts) as well as the graph, which is where
# the census found its 276 fact-log rows. basis: recorded (count, type).
# `plant` names the attribute pattern. The build reports the count each
# enricher actually produced and REFUSES when it is zero or differs from the
# scaled count by more than `tolerance`: max(absolute, relative x planned).
# basis of the tolerance: guessed. Rounding a small scaled count to a whole
# number of planted records, and the two-way rules writing one relationship
# each way, move a count by one; measured at scale 0.01 and 0.1 the largest
# difference was one.
enricher_edges:
  basis: recorded
  tolerance:
    absolute: 1
    relative: 0.10
  _enricher:declarative:citation_cites_paper_by_paper_id:
    edge_type: cites
    count: 182
    plant: citation.cited_paper_ref equals a bib paper's paper_id
  _enricher:declarative:commit_message_subject_starts_with_change_slug:
    edge_type: references
    count: 86
    plant: git_commit.message_subject starts with an open_spec_change change_id
  _enricher:declarative:forge_item_word_boundary_mentions_change_slug:
    edge_type: references
    count: 4
    plant: an issue or pull_request title names an open_spec_change change_id
  _enricher:acceptance_criteria:
    edge_type: verified_by
    count: 2
    plant: a test_case name carries an acceptance criterion id
    # Each planted case links twice at scale 1.0 (lab-host run: 4 for 2
    # planned), so this enricher alone allows a difference of 2.
    tolerance_absolute: 2
  _enricher:security_finding:
    edge_type: affects
    count: 2
    plant: a security or secret finding's path names a source_file path

# Record-level shape the console reads depend on.
search:
  basis: recorded
  # GET /viz/api/console/records/search?q=deployment. The census counted
  # 22,030 live records whose attributes contain the term (18.0%); the
  # generator puts it in the searchable text of the same share.
  term: deployment
  records_with_term: 22030
  # The budget review asked for at least this many candidates at scale 1.0.
  minimum_candidates: 200

attributes:
  basis: guessed
  # No per-record payload size was recorded. Searchable text is about this
  # many characters, with the planted search term in the share above.
  text_chars: 240

# Version history. The census found ONE published generation and two branch
# checkpoints today, but interval history of about 1.86M record rows and
# 2.84M relationship rows (pg reltuples estimates), 15x and 3.8x the live
# counts: the database kept the history of a deeper past. The production
# budgets in okg.viz.console_perf_budgets were measured on that deeper past
# (88 checkpoints, 42 published, 2026-09-22).
#
# `deep` is the nightly profile and the command-line default. The budgets
# were set on the deep shape, and the views that read history cost several
# times more on it: at scale 0.01 the independent review of PR #3136 measured
# deep vs current at generations 57.6 vs 5.7 ms, attempts 30.2 vs 3.5,
# versions 36 vs 8, view-diagnostics 13 vs 2.2, enricher-diagnostics 35.7 vs
# 15.6, records-types 45.8 vs 27.3, producer-metrics 111 vs 77, and
# records-search 398 vs 344.
history:
  basis: recorded
  # The build refuses when the interval tables hold fewer rows than live
  # rows plus planned re-writes, less this share. basis: guessed (a re-write
  # the graph store treats as unchanged writes no row).
  interval_depth_tolerance: 0.01
  interval_rows:
    records: 1860000
    relationships: 2840000
  profiles:
    # Today's publish count: the bulk publish and nothing after it. Interval
    # depth stays near 1x, which understates today's interval tables; use
    # `deep` when interval depth matters.
    current:
      publishes: 1
      # Re-write rounds spread over the follow-up publishes. None here.
      record_churn_rounds: 0.0
      relationship_churn_rounds: 0.0
    # The deeper history: 42 published generations (the 2026-09-22 shape the
    # budgets were measured on). Each follow-up publish re-writes a slice of
    # records and relationships, so the interval tables reach the recorded
    # depth: (1,860,000 - 122,366) / 122,366 = 14.2 extra record versions
    # each and (2,840,000 - 741,364) / 741,364 = 2.83 extra relationship
    # versions each.
    deep:
      publishes: 42
      record_churn_rounds: 14.2
      relationship_churn_rounds: 2.83
    # NOT a production shape: the per-pull-request test's profile. Three
    # publishes are enough to prove follow-up publishes build interval
    # history through the same path `deep` uses, in seconds.
    smoke:
      publishes: 3
      record_churn_rounds: 0.5
      relationship_churn_rounds: 0.2

# Known limits of this shape, recorded rather than fixed. Each is a place the
# synthetic graph may cost the console less (or more) than the live one.
known_limits:
  basis: recorded
  limits:
    - The search share was counted with `attrs::text ILIKE '%deployment%'`
      over whole attribute documents; records search ranks `attrs->>'text'`
      with BM25, so the live number of BM25 candidates is not known.
    - Text length (attributes.text_chars) is a guess; no per-record payload
      size was recorded.
    - Relationships are spread evenly over their endpoints (no skew). None of
      the 22 budgeted views reads a single record's relationships; the
      per-record reads that would feel skew are excluded from the budgets.
    - One branch checkpoint per publish; the 2026-09-22 history also had
      about 46 checkpoints that never published.
  # Fields the next census should record (a live read needs Jason's own
  # grant). Each would turn a guess above into a recorded number.
  next_census_fields:
    - "count of live records with attrs ? 'text'"
    - "average length of attrs->>'text' per record type"
    - "the real BM25 match count for 'deployment' (what records/search sees)"
    - "pg_column_size(attrs) per record type (average and p95)"

