# Production-scale targets for the synthetic okg-workspace graph.
#
# This file is the ONE place the generator's numbers live. Every number names
# its provenance with a `basis:` on the block that holds it:
#
#   recorded  -- read from okg-workspace by the census below. Change it only
#                from a newer read of the live deployment.
#   derived   -- not read directly, but fixed by recorded totals (for
#                example a per-source edge total split across that source's
#                declared triples so every per-source AND per-type total
#                still equals the census). The note says how.
#   guessed   -- no recorded basis. The note says what the guess is.
#
# Census: read-only count of okg-workspace (dogfood container), 2026-10-01,
# approved by Jason 189a. The census was run by the lane T lead with
# `default_transaction_read_only=on`; nothing in this repository connects to
# a live deployment. A newer census edits this file and nothing else.
#
# Scale: every count below is the scale-1.0 value. The generator multiplies by
# --scale and rounds, keeping any count that is non-zero at scale 1.0 at
# least 1, so every recorded record type and producer stays present at small
# scale.

