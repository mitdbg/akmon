deployment: okg-workspace
census:
  read_at: "2026-10-01"
  provenance: >-
    read-only count of okg-workspace (dogfood container), 2026-10-01,
    approved by Jason 189a
  # The earlier figure in
  # pact/changes/console-default-remove-old-views/evidence/browser-proof.md
  # (122,366 records, 741,364 relationships, 62 record types) agrees with
  # this census.

