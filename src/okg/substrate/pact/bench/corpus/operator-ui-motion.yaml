change:
  id: operator-ui-motion
  title: 'Motion: theme crossfade + eased interactions across the console'
  status: proposal
  tier: 1
  rationale: The console re-fires between themes with a short colour crossfade instead
    of a hard cut; hover/active states and menus ease; all motion is disabled under
    prefers-reduced-motion. Applied on the shared shell and tokens so it reaches every
    view. Verified across firings; visual approval is reviewer-owned (operator).
