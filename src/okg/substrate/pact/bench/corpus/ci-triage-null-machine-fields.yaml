pact_version: 4
target_pact_version: 4
change:
  id: ci-triage-null-machine-fields
  title: Align CI machine-field decoding with graph data
  status: proposal
  tier: 1
  rationale: Nomos-safe CI triage must remain usable when valid CI records omit an
    optional machine value or use a closed string identifier for a non-GitHub run.
  root_cause: The read-side machine-field decoder treats JSON null as an unsafe type,
    assumes run_id is globally an unsigned GitHub integer even though triage reads
    multiple node subtypes, and the text renderer formats nullable job conclusions
    without an unavailable-state fallback.
  method_metadata:
    pact_shape: fast_path
    fast_path: Compact PACT for small nontrivial work. Upgrade when scope, risk, hierarchy,
      formal proof, graph evidence, or review complexity increases.
  affected_areas:
  - okg-ci operator triage
  - Nomos-safe graph reads
  affected_code:
  - deployments/okg-ci/triage.py
  - tests/okg-ci/test_triage_health.py
requirements:
- id: req.ci-triage-null-machine-fields
  title: Decode valid optional CI machine fields
  statement: Triage must preserve JSON null as unavailable, accept run_id as either
    a non-negative integer or non-empty closed machine token, render nullable job
    conclusions as pending or unknown, and continue to reject unsafe types, free text,
    and malformed fenced values.
  evidence_policy:
    required:
    - executed_test
  scenarios: []
  acceptance:
  - id: acc.ci-triage-null-machine-fields
    description: Focused tests prove null is inert for every closed machine field,
      numeric and token run IDs decode, unsafe values still fail closed, default text
      output renders nullable jobs, and an operator-backed report can decode the live
      graph shapes.
    evidence:
    - executed_test
