# Deterministic code-structure facts (modules, classes, functions,
# imports) for an explicitly chosen project repo. Python-only by
# default; extend `include_exts` to widen the language scope.
code_structure:
  enabled_by_default: false
  module: okg.substrate.library.sources.code_graph
  class: CodeStructureSource
  ownership_id: ${deployment_name}.code_structure
  predecessor_source: ${deployment_name}.git_files
  source_class: discovery_crawl
  record_identity_kind: scoped_locator
  record_identity_fields: [repo, path]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  params:
    repo: ${deployment_name}
    repo_root: ${git_repos}
    include_exts: [".py"]
    exclude_globs:
      - "__pycache__/**"
      - "**/__pycache__/**"
      - ".venv/**"
      - "**/.venv/**"
      - ".git/**"
      - "**/.git/**"
      - ".claude/**"
      - "**/.claude/worktrees/**"
      - "data/**"
      - "testdata/**"
      - ".scratch/**"
      - "**/.scratch/**"
