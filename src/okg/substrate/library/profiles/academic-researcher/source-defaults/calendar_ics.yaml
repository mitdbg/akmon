# calendar_ics — reads operator-provided .ics URL or file path.
# Strict-allowlist filter: only events with `okg:` tag in
# DESCRIPTION/SUMMARY OR matching default recurring patterns
# (lab meeting, group meeting, 1:1 with, office hours).

calendar_ics:
  enabled_by_default: false
  module: okg.substrate.library.sources.calendar_ics
  class: CalendarIcsSource
  ownership_id: ${deployment_name}.calendar_ics
  source_class: discovery_crawl
  record_identity_kind: scoped_locator
  record_identity_fields: [external_ref]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  params:
    calendar_ics_url: ${calendar_ics}
    feed_name: ${deployment_name}-default

  # Untrusted-origin content: held on the quarantine branch until an
  # operator approves it via `okg admission decide` (PACT
  # make-admission-review-load-bearing).
  admission_policy:
    trust_label: untrusted
    admission_mode: review
    output_scope_summary: "calendar invites are attacker-deliverable; titles/bodies are third-party-authored"
