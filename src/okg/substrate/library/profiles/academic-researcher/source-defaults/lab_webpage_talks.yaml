# lab_webpage_talks — scrapes lab webpage's "talks" section.

lab_webpage_talks:
  enabled_by_default: false
  module: okg.substrate.library.sources.academic_researcher.lab_webpage_talks
  class: LabWebpageTalksSource
  ownership_id: ${deployment_name}.lab_webpage_talks
  source_class: discovery_crawl
  record_identity_kind: scoped_locator
  record_identity_fields: [url, idx]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  params:
    talks_url: ${lab_talks_url}

  # Untrusted-origin content: held on the quarantine branch until an
  # operator approves it via `okg admission decide` (PACT
  # make-admission-review-load-bearing).
  admission_policy:
    trust_label: untrusted
    admission_mode: review
    output_scope_summary: "scraped lab/talks web pages; free text is attacker-influenceable"
