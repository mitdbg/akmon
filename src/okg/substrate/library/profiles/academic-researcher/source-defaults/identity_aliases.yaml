# Deterministic same_as aliases across scholarly identity surfaces.
# This source reads the current live graph through the deployment DSN
# and emits explicit same_as edges for duplicate paper/person nodes
# sharing normalized DOI/arXiv/provider ids or clean title+year.
identity_aliases:
  enabled_by_default: false
  module: okg.substrate.library.sources.scholarly.scholarly_identity_aliases
  class: IdentityAliasSource
  ownership_id: ${deployment_name}.identity_aliases
  source_class: discovery_crawl
  record_identity_kind: scoped_locator
  record_identity_fields: [subtype, kind, value_hash, alias, canonical]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  params:
    include_title_aliases: true
