# Author identity aliases (Lamport / Leslie Lamport / L. Lamport).
# Optional — the operator curates `author_aliases.yaml` under
# `papers_dir` to canonicalize author names across DBLP, OpenAlex,
# etc.
#
# `enabled_by_default: false` per `fix-academic-pi-source-templating-
# defaults` Phase 1: this source requires an operator-curated
# `author_aliases.yaml` file. With no `papers_dir` answer at install
# time the template renders `aliases_yaml_path` as `/author_aliases.yaml`
# (root) and the source fails. Operator enables it later via
# the setup planner, or use the low-level `add_source` recovery hook,
# once the YAML is in place.
author_aliases:
  enabled_by_default: false
  module: okg.substrate.library.sources.scholarly.author_aliases
  class: AuthorAliasesSource
  ownership_id: ${deployment_name}.author_aliases
  source_class: discovery_crawl
  record_identity_kind: scoped_locator
  record_identity_fields: [aliases_yaml_path, alias_key]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  params:
    aliases_yaml_path: ${papers_dir}/author_aliases.yaml
