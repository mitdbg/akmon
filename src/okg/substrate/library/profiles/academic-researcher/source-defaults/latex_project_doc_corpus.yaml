# Optional document owner for complete LaTeX projects. The papers directory
# supplies extractors.yaml so parser/chunker selection remains deployment-owned.
latex_project_doc_corpus:
  enabled_by_default: false
  module: okg.substrate.library.sources.doc_corpus
  class: DocCorpusSource
  ownership_id: ${deployment_name}.latex_project_doc_corpus
  source_class: discovery_crawl
  record_identity_kind: scoped_locator
  record_identity_fields: [repo, path]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  params:
    repo: ${deployment_name}.papers
    repo_root: ${papers_dir}
    extractors_dir: ${papers_dir}
    predecessor_source: ${deployment_name}.latex_project_git_files
    include_globs: ["**/*"]
    exclude_globs: []
    project_manifest:
      repository_authority: ${deployment_name}.papers
      projects:
        - project_dir: .
      include_generated_paths: []
      generated_dirs: []
