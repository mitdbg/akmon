# Concept canonicalization aliases. Writes directly to the alias
# table (instead of emitting facts) so it needs a DSN.
#
# `enabled_by_default: false` per `fix-academic-pi-source-templating-
# defaults` Phase 1: this source requires an operator-curated
# `concept_aliases.yaml` file. With no `papers_dir` answer at install
# time the template renders `aliases_path` as `/concept_aliases.yaml`
# (root) and the source fails. Operator enables it later by hand-
# editing the registry once the YAML is in place.
concept_aliases:
  enabled_by_default: false
  module: okg.substrate.library.sources.concept_aliases
  class: ConceptAliasesSource
  ownership_id: ${deployment_name}.concept_aliases
  source_class: reference_catalog
  record_identity_kind: domain_key
  record_identity_fields: [aliases_path, alias_key]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  params:
    aliases_path: ${papers_dir}/concept_aliases.yaml
