# group_webpage_scrape — HTTP + LLM/heuristic extraction of
# group webpage members. Emits Advisee + Lab.

group_webpage_scrape:
  enabled_by_default: false
  module: okg.substrate.library.sources.academic_researcher.group_webpage_scrape
  class: GroupWebpageScrapeSource
  ownership_id: ${deployment_name}.group_webpage_scrape
  source_class: discovery_crawl
  record_identity_kind: scoped_locator
  record_identity_fields: [url, idx]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  params:
    group_webpage: ${group_webpage}
    advisor_orcid: ${orcid}

  # Untrusted-origin content: held on the quarantine branch until an
  # operator approves it via `okg admission decide` (PACT
  # make-admission-review-load-bearing).
  admission_policy:
    trust_label: untrusted
    admission_mode: review
    output_scope_summary: "scraped third-party web pages; free text is attacker-influenceable"
