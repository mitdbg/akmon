# outlook_mail_api — Microsoft Graph /messages/delta with strict
# folder allowlist. Requires `outlook_folders`; the source refuses
# to run without an allowlist (no wholesale mailbox ingest).
# Shares the tenant-internal `msgraph` Entra app with outlook-cal.

outlook_mail_api:
  enabled_by_default: false
  module: okg.substrate.library.sources.outlook_api
  class: OutlookMailApiSource
  ownership_id: ${deployment_name}.outlook_mail_api
  source_class: mutable_api
  record_identity_kind: remote_id
  record_identity_fields: [message_id]
  source_revision_kind: version_token
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  params:
    deployment_name: ${deployment_name}
    outlook_folders: ${outlook_folders}
    pii_mode: ${pii_mode}
    max_body_kb: 50
