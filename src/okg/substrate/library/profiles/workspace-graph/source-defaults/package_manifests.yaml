package_manifests:
  module: okg.substrate.library.sources.code_graph
  class: PackageManifestSource
  ownership_id: ${deployment_name}.package_manifests
  predecessor_source: ${deployment_name}.git_files
  source_class: discovery_crawl
  record_identity_kind: scoped_locator
  record_identity_fields: [repo, path]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  params:
    repo: ${deployment_name}
    repo_root: ${repo_root}
  # `okg runtime worker` checks this source every poll.interval_seconds and
  # re-reads it only when its change probe reports a change. Without the
  # worker, nothing here runs; `okg ingest` still refreshes on demand.
  sync:
    triggers: [poll, manual, reconcile]
    default_event_mode: scope_complete
    reconcile_mode: scope_complete
    poll:
      probe: change_probe
      interval_seconds: 300
