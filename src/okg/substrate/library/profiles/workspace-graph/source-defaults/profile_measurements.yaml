profile_measurements:
  module: okg.substrate.library.sources.profile_measurements
  class: ProfileMeasurementSource
  ownership_id: ${deployment_name}.profile_measurements
  predecessor_source:
    - ${deployment_name}.git_files
    - ${deployment_name}.openspec
  source_class: discovery_crawl
  record_identity_kind: scoped_locator
  record_identity_fields: [repo, artifact]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  params:
    repo: ${deployment_name}
    repo_root: ${repo_root}
    artifact_paths: []
    artifact_globs:
      - profiles/${deployment_name}/*/profile.json
      - .artifacts/profiles/${deployment_name}/*/profile.json
    benchmark_paths: []
    benchmark_globs:
      - reports/**/*benchmark*.json
      - .artifacts/**/*benchmark*.json
    performance_budgets: []
    openspec_roots:
      - ${repo_root}/openspec
    max_artifacts: 200
  # No poll: this reader's change probe cannot vouch for an unchanged read, so
  # a poll would re-run it, and every source after git_files, on every tick.
  # It is re-read whenever git_files changes, and by `okg ingest`.
