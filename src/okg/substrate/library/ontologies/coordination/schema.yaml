          edge_archetype: contains
          src_subtypes: WorkerPool
          dst_subtypes: RoleAgent
      work_gate_verifies_acceptance:
        annotations:
          edge_archetype: verifies
          src_subtypes: WorkGate
          dst_subtypes: AcceptanceCriterion
      work_gate_references_coordination_context:
        annotations:
          edge_archetype: references
          src_subtypes: WorkGate
          dst_subtypes: "CoordinationWorkArea,CoordinationOrgUnit"
      gate_result_references_gate_context:
