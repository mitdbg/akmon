      Lifted verbatim from
      `deployments/okg-workspace/schemas/bridges/coordination_edges.yaml`.
      Cross-module narrowings to reasoning subtypes are NOT
      declared here; they're owned by the first composing
      deployment (Wave B). See this module's schema.yaml header
      comment.
    annotations:
      okg_edge_narrowings: "true"
      okg_relation_kind:
        assigned_to: references
        affects: references
        verifies: references
        supported_by: references
        targets: references
    attributes:
      coordination_work_area_contains_assignment:
        annotations:
          edge_archetype: contains
          src_subtypes: CoordinationWorkArea
          dst_subtypes: AgentAssignment
      coordination_org_unit_contains_child:
        annotations:
          edge_archetype: contains
          src_subtypes: CoordinationOrgUnit
          dst_subtypes: CoordinationOrgUnit
      coordination_org_unit_references_policy:
        annotations:
          edge_archetype: references
          src_subtypes: CoordinationOrgUnit
          dst_subtypes: "CoordinationWorkArea,WorkerPool,RoleAgent"
      worker_pool_contains_role_agent:
