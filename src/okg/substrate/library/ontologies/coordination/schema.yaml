# Substrate coordination ontology.
#
# Lifted from `deployments/okg-workspace/schemas/coordination.yaml`
# and `deployments/okg-workspace/schemas/bridges/coordination_edges.yaml`
# per `lift-coordination-to-substrate-library` (Wave A of the
# `expand-memex-to-personal-okg` umbrella). Thirteen subtypes
# describing supervised agent execution: work orders, role
# agents, workspace leases, proofs of work, reviews.
#
# Source-of-truth migration: behavior preserved; only schema
# `id:` and `class_uri:` prefix change (`okg_workspace:` →
# `coord:`). Existing okg-workspace DB nodes remain valid.
#
# Cross-module narrowings to reasoning subtypes (Pattern A:
# WorkspaceObservation derives_to Observation; Pattern B:
# WorkOrder addresses Question, Review references Refutation)
# are NOT declared here. They're owned by the first deployment
# composing both coordination and reasoning modules (Wave B
# `memex-compose-personal-okg-deployment`); see this proposal's
# design.md D3. The rule files live at
# `library/ontologies/coordination/cross_links/coordination_to_reasoning.yaml`
# wired via coordination's `module.yaml` `extends.reasoning` block.
id: https://palimpzest.mit.edu/okg/modules/coordination
name: coordination
title: "Coordination — supervised agent execution"
description: >-
  Work orders, role-agent assignments, workspace leases,
  proofs of work, reviews, and merge decisions. Models the
  supervisor / persistent-worker execution flow. Originally
  shipped via `add-okg-workspace-coordination-graph`, refined
  by `refactor-okg-workspace-coordination-contract`; lifted
  to substrate per `lift-coordination-to-substrate-library`.

