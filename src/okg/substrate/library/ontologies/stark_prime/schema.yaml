id: https://palimpzest.mit.edu/okg/modules/stark_prime
name: stark_prime
title: STaRK-Prime — the PrimeKG-derived biomedical retrieval graph
description: |-
  The entity and relation vocabulary of the STaRK-Prime semi-structured
  knowledge base (`snap-stanford/stark`, `skb/prime/processed.zip`), as the
  release itself states it: 10 entity types from `node_type_dict.pkl`, 18
  relation types from `edge_type_dict.pkl`, and the 56 (src, relation, dst)
  triples those two dictionaries and `edge_index.pt` actually realise.

  ANSWER UNIT. STaRK-Prime's gold is a SET OF ENTITY INDICES into the 0..N-1
  space `node_types.pt` defines, scored as a ranked list. Node ids are therefore
  `stark_prime:entity:<index>` — no type segment, so a gold id resolves to a
  node id by formatting alone. The corpus must hold that vocabulary for the
  question to be answerable at all; what it must NOT hold is the question->answer
  mapping, which lives only in `qa/prime/stark_qa/stark_qa.csv` and is refused
  by both the source and the benchmark adapter.

  NARROWINGS ARE THE RELEASE'S TRIPLES, ONE PER LINE, NOT A CROSS PRODUCT.
  `src_subtypes` accepts a list and the composer expands src x dst, which for
  a symmetric relation like `expression_present` would admit `anatomy -> anatomy`
  and `gene_protein -> gene_protein` — two triples the release does not state.
  Each of the 56 is therefore declared on its own, so the narrowing catalog
  refuses at insert exactly the edges the release does not carry.

  DIRECTION. The release is perfectly symmetric: 8,100,498 directed rows over
  4,050,249 undirected relations, 0 self-loops, every row's reverse present
  (checked exhaustively). Both directions are declared and emitted, because
  that is what the release states; the pairs are visible above as the 28
  mirrored triples.

  PACT okg-bench-graph-benchmarks / req.stark.corpus.
prefixes:
  linkml: https://w3id.org/linkml/
  okg: https://palimpzest.mit.edu/okg/
  stark_prime: https://palimpzest.mit.edu/okg/modules/stark_prime/
default_range: string
imports:
- linkml:types
classes:
  StarkPrimeDisease:
    description: |-
      A disease or disorder, MONDO-grounded. Released type name 'disease';
      17,080 entities in the pinned release.
      Node id stark_prime:entity:<entity_index>, where entity_index
      is the release's own 0..129374 index — the same space the QA
      answer ids live in.
    class_uri: stark_prime:StarkPrimeDisease
    attributes:
      entity_index:
        required: true
        range: integer
        description: The release's 0-based entity index; the unit
          STaRK's gold answer sets are expressed in.
      name:
        required: true
        description: The entity's released display name.
      stark_node_type:
        required: true
        description: The released type string, verbatim (e.g.
          'gene/protein'), kept unnormalised so a node states which
          release vocabulary it came from.
      primekg_id:
        description: The upstream source identifier the release
          carries (NCBI gene id, MONDO id, DrugBank id, ...).
          Not unique across types and never used as node identity.
      source_db:
        description: The upstream database the release names.
      text:
        required: true
        description: |-
          Name plus the release's own `details` prose, joined in a
          DECLARED key order and truncated to 4000 chars. The order
          is fixed in the source so a release that adds a details
          field cannot silently rewrite every entity's retrieval
          text under a running benchmark.
      text_truncated:
        range: boolean
        description: True when `text` hit the 4000-char bound.
      no_relations_reason:
        description: |-
          Present ONLY on a bounded (`max_entities`) build, naming
          why this entity has no incident edge. A COMPLETE build
          never carries it: the release declares minimum degree 2
          and zero isolates, so the source refuses an isolate
          outright rather than excusing it with a stamp derived
          from the same edge_index the emission walks.
      declared_degree:
        range: integer
        description: Companion to no_relations_reason — the entity's
          degree in the WHOLE release, so a bounded build states how
          much it dropped.
    annotations:
      archetype: artifact
      transient: 'false'
