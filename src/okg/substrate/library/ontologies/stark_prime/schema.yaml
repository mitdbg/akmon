  EdgeNarrowings:
    description: |-
      The 56 (src_subtype, relation, dst_subtype) triples the pinned
      release realises, one narrowing each. Generated from a census of
      `edge_index.pt` + `edge_types.pt` + `node_types.pt`, not written
      by hand: composition is determined by the release. The source's
      PRIME_RELEASE_TRIPLES holds the same 56 keys and a run refuses if
      the release realises a triple that is not among them.
    annotations:
      okg_edge_narrowings: 'true'
    attributes:
      stark_prime_disease_associated_with_stark_prime_gene_protein:
        description: 80,411 rows in the pinned release.
        annotations:
          edge_archetype: associated_with
          src_subtypes: StarkPrimeDisease
          dst_subtypes: StarkPrimeGeneProtein
