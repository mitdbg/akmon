sources:
  git-files:
    module: okg.substrate.library.sources.git_graph_files
    class: GitFilesSource
    ownership_id: "{{ deployment_name }}.git-files"
    params:
      repo: "{{ deployment_name }}"
      repo_root: "{{ repo_root }}"
      include_untracked: true
      exclude_globs: &repo_excludes
        - "__pycache__/**"
        - "**/__pycache__/**"
        - ".venv/**"
        - "**/.venv/**"
        - "node_modules/**"
        - "**/node_modules/**"
        - ".git/**"
        - "**/.git/**"
        - ".mypy_cache/**"
        - "**/.mypy_cache/**"
        - ".pytest_cache/**"
        - "**/.pytest_cache/**"
        - ".claude/**"
        - "**/.claude/worktrees/**"
        - "data/**"
        - "bench/deployments-generated/**"
        - "**/bench/deployments-generated/**"
        - ".scratch/**"
        - ".tmp/**"
        - ".artifacts/**"
        - "memories/**"
        - "**/*.pyc"
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [repo, path]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    admission_policy:
      producer_id: "{{ deployment_name }}.git-files"
      producer_kind: source
      trust_label: repo-local-trusted
      admission_mode: fast_track
      authority_scope:
        source_family: okg_workspace_repo
        path_globs:
          - "**/*"
      allowed_record_kinds:
        - node
        - edge
      output_signature:
        nodes:
          - subtype: source_file
            id_prefix: "file:{{ deployment_name }}:"
            attrs:
              repo: "{{ deployment_name }}"
            clause_id: okg_workspace.git_files.source_file
          - subtype: git_branch
            id_prefix: "branch:{{ deployment_name }}:"
            attrs:
              repo: "{{ deployment_name }}"
            clause_id: okg_workspace.git_files.git_branch
        edges:
          # GitFilesSource emits file->branch membership (git_graph module's
          # `file_member_of_branch` narrowing). Must be declared or admission
          # rejects the batch with producer_record_kind_not_allowed.
          - src_subtype: source_file
            edge_type: member_of
            dst_subtype: git_branch
            src_id_prefix: "file:{{ deployment_name }}:"
            dst_id_prefix: "branch:{{ deployment_name }}:"
            clause_id: okg_workspace.git_files.file_member_of_branch
      policy_clauses:
        - id: okg_workspace.git_files.source_file
          effect: allow
          record_kind: node
          subtype: source_file
        - id: okg_workspace.git_files.git_branch
          effect: allow
          record_kind: node
          subtype: git_branch
        - id: okg_workspace.git_files.file_member_of_branch
          effect: allow
          record_kind: edge
          triple: [source_file, member_of, git_branch]
      output_scope_summary:
        nodes:
          - source_file
          - git_branch
        edges:
          - source_file member_of git_branch
        scope: "Working tree files from the Workspace Graph repository"
    sync: &repo_tree_sync
      watch:
        roots: ["__OKG_REPO_ROOT__"]
        include_globs: ["**/*"]
        exclude_globs: *repo_excludes
      triggers: [fs_event, manual, reconcile]
      default_event_mode: scope_complete
      reconcile_mode: scope_complete
      deletes_require_reconcile: true
      scoped_delete_mode: scope_complete
      scoped_delete_dependent_fanout: closure
      cheap_probe: content_hash

  code-structure:
    module: okg.substrate.library.sources.code_graph
    class: CodeStructureSource
    ownership_id: "{{ deployment_name }}.code-structure"
    predecessor_source: "{{ deployment_name }}.git-files"
    params:
      repo: "{{ deployment_name }}"
      repo_root: "{{ repo_root }}"
      include_exts: [".py", ".js", ".jsx", ".ts", ".tsx", ".go", ".rs", ".c", ".cc", ".cpp", ".cxx", ".h", ".hpp"]
      exclude_globs: *repo_excludes
      max_files: 5000
      max_bytes_per_file: 1000000
      git_frontier_skip: true
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [repo, path]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    admission_policy:
      producer_id: "{{ deployment_name }}.code-structure"
      producer_kind: source
      trust_label: repo-local-trusted
      admission_mode: fast_track
      authority_scope:
        source_family: okg_workspace_repo
        path_globs:
          - "**/*.py"
          - "**/*.js"
          - "**/*.jsx"
          - "**/*.ts"
          - "**/*.tsx"
          - "**/*.go"
          - "**/*.rs"
          - "**/*.c"
          - "**/*.cc"
          - "**/*.cpp"
          - "**/*.h"
          - "**/*.hpp"
      allowed_record_kinds:
        - node
        - edge
      output_signature:
        nodes:
          - subtype: code_symbol
            id_prefix: "symbol:{{ deployment_name }}:"
            attrs:
              repo: "{{ deployment_name }}"
            clause_id: okg_workspace.code_structure.code_symbol
          - subtype: code_import
            id_prefix: "import:"
            attrs:
              repo: "{{ deployment_name }}"
            clause_id: okg_workspace.code_structure.code_import
          - subtype: code_reference
            id_prefix: "reference:"
            attrs:
              repo: "{{ deployment_name }}"
            clause_id: okg_workspace.code_structure.code_reference
        edges:
          - src_subtype: source_file
            edge_type: contains
            dst_subtype: code_symbol
            src_id_prefix: "file:{{ deployment_name }}:"
            dst_id_prefix: "symbol:{{ deployment_name }}:"
            clause_id: okg_workspace.code_structure.file_contains_symbol
          - src_subtype: source_file
            edge_type: contains
            dst_subtype: code_import
            src_id_prefix: "file:{{ deployment_name }}:"
            dst_id_prefix: "import:"
            clause_id: okg_workspace.code_structure.file_contains_import
          - src_subtype: source_file
            edge_type: contains
            dst_subtype: code_reference
            src_id_prefix: "file:{{ deployment_name }}:"
            dst_id_prefix: "reference:"
            clause_id: okg_workspace.code_structure.file_contains_reference
          - src_subtype: code_symbol
            edge_type: member_of
            dst_subtype: code_symbol
            src_id_prefix: "symbol:{{ deployment_name }}:"
            dst_id_prefix: "symbol:{{ deployment_name }}:"
            clause_id: okg_workspace.code_structure.symbol_member_of_symbol
          - src_subtype: code_reference
            edge_type: references
            dst_subtype: code_symbol
            src_id_prefix: "reference:"
            dst_id_prefix: "symbol:{{ deployment_name }}:"
            clause_id: okg_workspace.code_structure.reference_references_symbol
          - src_subtype: code_symbol
            edge_type: calls
            dst_subtype: code_symbol
            src_id_prefix: "symbol:{{ deployment_name }}:"
            dst_id_prefix: "symbol:{{ deployment_name }}:"
            clause_id: okg_workspace.code_structure.symbol_calls_symbol
      policy_clauses:
        - id: okg_workspace.code_structure.code_symbol
          effect: allow
          record_kind: node
          subtype: code_symbol
        - id: okg_workspace.code_structure.code_import
          effect: allow
          record_kind: node
          subtype: code_import
        - id: okg_workspace.code_structure.code_reference
          effect: allow
          record_kind: node
          subtype: code_reference
        - id: okg_workspace.code_structure.file_contains_symbol
          effect: allow
          record_kind: edge
          triple: [source_file, contains, code_symbol]
        - id: okg_workspace.code_structure.file_contains_import
          effect: allow
          record_kind: edge
          triple: [source_file, contains, code_import]
        - id: okg_workspace.code_structure.file_contains_reference
          effect: allow
          record_kind: edge
          triple: [source_file, contains, code_reference]
        - id: okg_workspace.code_structure.symbol_member_of_symbol
          effect: allow
          record_kind: edge
          triple: [code_symbol, member_of, code_symbol]
        - id: okg_workspace.code_structure.reference_references_symbol
          effect: allow
          record_kind: edge
          triple: [code_reference, references, code_symbol]
        - id: okg_workspace.code_structure.symbol_calls_symbol
          effect: allow
          record_kind: edge
          triple: [code_symbol, calls, code_symbol]
      output_scope_summary:
        nodes:
          - code_symbol
          - code_import
          - code_reference
        edges:
          - source_file contains code_symbol
          - source_file contains code_import
          - source_file contains code_reference
          - code_symbol member_of code_symbol
          - code_reference references code_symbol
          - code_symbol calls code_symbol
        scope: "Static code structure extracted from tracked okg-workspace source files"
    sync: *repo_tree_sync

  package-manifests:
    module: okg.substrate.library.sources.code_graph
    class: PackageManifestSource
    ownership_id: "{{ deployment_name }}.package-manifests"
    predecessor_source: "{{ deployment_name }}.git-files"
    params:
      repo: "{{ deployment_name }}"
      repo_root: "{{ repo_root }}"
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [repo, path]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    admission_policy:
      producer_id: "{{ deployment_name }}.package-manifests"
      producer_kind: source
      trust_label: repo-local-trusted
      admission_mode: fast_track
      authority_scope:
        source_family: okg_workspace_repo
        path_globs:
          - "pyproject.toml"
          - "uv.lock"
          - "package.json"
          - "package-lock.json"
          - "pnpm-lock.yaml"
          - "yarn.lock"
          - "requirements*.txt"
          - "Cargo.toml"
          - "Cargo.lock"
          - "go.mod"
          - "go.sum"
      allowed_record_kinds:
        - node
        - edge
      output_signature:
        nodes:
          - subtype: package_manifest
            id_prefix: "manifest:{{ deployment_name }}:"
            attrs:
              repo: "{{ deployment_name }}"
            clause_id: okg_workspace.package_manifests.manifest
          - subtype: dependency_package
            id_prefix: "dep:"
            clause_id: okg_workspace.package_manifests.dependency
        edges:
          - src_subtype: source_file
            edge_type: contains
            dst_subtype: package_manifest
            src_id_prefix: "file:{{ deployment_name }}:"
            dst_id_prefix: "manifest:{{ deployment_name }}:"
            clause_id: okg_workspace.package_manifests.file_contains_manifest
          - src_subtype: package_manifest
            edge_type: contains
            dst_subtype: dependency_package
            src_id_prefix: "manifest:{{ deployment_name }}:"
            dst_id_prefix: "dep:"
            clause_id: okg_workspace.package_manifests.manifest_contains_dependency
      policy_clauses:
        - id: okg_workspace.package_manifests.manifest
          effect: allow
          record_kind: node
          subtype: package_manifest
        - id: okg_workspace.package_manifests.dependency
          effect: allow
          record_kind: node
          subtype: dependency_package
        - id: okg_workspace.package_manifests.file_contains_manifest
          effect: allow
          record_kind: edge
          triple: [source_file, contains, package_manifest]
        - id: okg_workspace.package_manifests.manifest_contains_dependency
          effect: allow
          record_kind: edge
          triple: [package_manifest, contains, dependency_package]
      output_scope_summary:
        nodes:
          - package_manifest
          - dependency_package
        edges:
          - source_file contains package_manifest
          - package_manifest contains dependency_package
        scope: "Package manifests and dependency declarations from tracked okg-workspace files"
    sync:
      watch:
        roots: ["__OKG_REPO_ROOT__"]
        include_globs:
          - "pyproject.toml"
          - "uv.lock"
          - "package.json"
          - "package-lock.json"
          - "pnpm-lock.yaml"
          - "yarn.lock"
          - "requirements*.txt"
          - "Cargo.toml"
          - "Cargo.lock"
          - "go.mod"
          - "go.sum"
        exclude_globs: ["**/.git/**", "**/node_modules/**"]
      triggers: [fs_event, manual, reconcile]
      default_event_mode: scope_complete
      reconcile_mode: scope_complete
      deletes_require_reconcile: true
      cheap_probe: content_hash

  interfaces:
    module: okg.substrate.library.sources.code_graph
    class: InterfaceSource
    ownership_id: "{{ deployment_name }}.interfaces"
    predecessor_source:
      - "{{ deployment_name }}.git-files"
      - "{{ deployment_name }}.code-structure"
    params:
      repo: "{{ deployment_name }}"
      repo_root: "{{ repo_root }}"
      include_exts: [".py"]
      exclude_globs: *repo_excludes
      max_files: 5000
      max_bytes_per_file: 1000000
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [repo, path]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    admission_policy:
      producer_id: "{{ deployment_name }}.interfaces"
      producer_kind: source
      trust_label: repo-local-trusted
      admission_mode: fast_track
      authority_scope:
        source_family: okg_workspace_repo
        path_globs:
          - "**/*.py"
      allowed_record_kinds:
        - node
        - edge
      output_signature:
        nodes:
          - subtype: interface_endpoint
            id_prefix: "endpoint:{{ deployment_name }}:"
            attrs:
              repo: "{{ deployment_name }}"
            clause_id: okg_workspace.interfaces.endpoint
        edges:
          - src_subtype: interface_endpoint
            edge_type: routes_to
            dst_subtype: code_symbol
            src_id_prefix: "endpoint:{{ deployment_name }}:"
            dst_id_prefix: "symbol:{{ deployment_name }}:"
            clause_id: okg_workspace.interfaces.endpoint_routes_to_symbol
      policy_clauses:
        - id: okg_workspace.interfaces.endpoint
          effect: allow
          record_kind: node
          subtype: interface_endpoint
        - id: okg_workspace.interfaces.endpoint_routes_to_symbol
          effect: allow
          record_kind: edge
          triple: [interface_endpoint, routes_to, code_symbol]
      output_scope_summary:
        nodes:
          - interface_endpoint
        edges:
          - interface_endpoint routes_to code_symbol
        scope: "HTTP, MCP, and CLI endpoints discovered from okg-workspace Python source"
    sync: *repo_tree_sync

