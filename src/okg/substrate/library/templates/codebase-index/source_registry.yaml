        include_globs:
          - "profiles/{{ deployment_name }}/*/profile.json"
          - ".artifacts/profiles/{{ deployment_name }}/*/profile.json"
          - "reports/**/*benchmark*.json"
          - ".artifacts/**/*benchmark*.json"
        exclude_globs: ["**/.git/**"]
      triggers: [fs_event, manual, reconcile]
      default_event_mode: scope_incomplete
      reconcile_mode: scope_complete
      deletes_require_reconcile: true
      cheap_probe: content_hash
      scope:
        accepts: [path]
        unsupported_fallback: scope_complete
      dependents:
        on_event: direct
        on_reconcile: closure
      compaction:
        window_seconds: 30
        max_events: 250
        max_scope_keys: 250

  codex-sessions:
    module: okg.substrate.library.sources.codex_sessions
    class: CodexSessionsSource
    ownership_id: "{{ deployment_name }}.codex-sessions"
    predecessor_source: "{{ deployment_name }}.git-files"
    params:
      repo: "{{ deployment_name }}"
      repo_root: "{{ repo_root }}"
      codex_sessions_root: ~/.codex/sessions
      archived_sessions_root: ~/.codex/archived_sessions
      cwd_filter:
        - "{{ repo_root }}"
      since: "{{ since }}"
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [repo, node_id]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    sync:
      watch:
        roots: [~/.codex/sessions, ~/.codex/archived_sessions]
        include_globs: ["**/*.jsonl"]
        exclude_globs: ["**/.DS_Store"]
      triggers: [fs_event, manual, reconcile]
      default_event_mode: scope_incomplete
      reconcile_mode: scope_complete
      deletes_require_reconcile: true
      scoped_delete_mode: scope_complete
      scoped_delete_dependent_fanout: none
      cheap_probe: content_hash
      scope:
        accepts: [path]
        unsupported_fallback: scope_complete
      dependents:
        on_event: none
        on_reconcile: closure
      compaction:
        window_seconds: 30
        max_events: 250
        max_scope_keys: 250

  doc-corpus:
    module: okg.substrate.library.sources.doc_corpus
    class: DocCorpusSource
    ownership_id: "{{ deployment_name }}.doc-corpus"
    params:
      repo: "{{ deployment_name }}"
      repo_root: "{{ repo_root }}"
      extractors_dir: "{{ deployment_dir }}"
      include_globs: &doc_corpus_include
        # Prose.
        - "**/*.md"
        - "**/*.txt"
        - "**/*.rst"
        # Structured configuration.
        - "**/*.json"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.toml"
        # Source. Only `**/*.py` was here before, so a graph over a polyglot
        # repository listed every file and could not search one word inside
        # any of the non-Python ones: `FROM`, `apk`, `bash` and `golang` all
        # returned nothing on a graph whose Dockerfile, shell script and
        # go.mod were right there. Every extension below is one `git-files`
        # already labels with a language, and one this template's
        # extractors.yaml has a parser for (directly or through the
        # `extension_to_format` routes below).
        - "**/*.py"
        - "**/*.pyx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.go"
        - "**/*.rs"
        - "**/*.rb"
        - "**/*.java"
        - "**/*.kt"
        - "**/*.c"
        - "**/*.h"
        - "**/*.cc"
        - "**/*.cpp"
        - "**/*.hpp"
        - "**/*.sh"
        - "**/*.bash"
        - "**/*.sql"
        - "**/*.proto"
        # Build and deploy files: templates, container and make recipes, CI
        # pipelines. Most have no telling extension, so each is routed by
        # file name in `extension_to_format` below (#2671).
        - "**/*.j2"
        - "**/*.tpl"
        - "**/*.tmpl"
        - "**/Dockerfile"
        - "**/Dockerfile.*"
        - "**/*.dockerfile"
        - "**/Containerfile"
        - "**/Makefile"
        - "**/makefile"
        - "**/GNUmakefile"
        - "**/*.mk"
        - "**/Jenkinsfile"
      # Route every code extension that has no dedicated parser to the plain
      # text one, so its bytes are stored verbatim. Without this, a glob can
      # match a file, produce a `document` node, and store NOTHING: the format
      # dispatch knows only `.py` among source extensions, and the tree-sitter
      # parsers for go/rust/js/ts/cpp need per-language grammars that are an
      # optional install. Measured on a real repository: adding the globs
      # alone gave a shell script and a Go file a document each and zero
      # chunks; with this mapping they carry their source.
      #
      # `.py` is deliberately absent -- it already routes to the Python AST
      # parser, which needs no extra install and extracts symbols too. A
      # deployment that installs the polyglot grammars can override any entry
      # here with `code_go`, `code_rust` and friends to get the same for those.
      #
      # A key that does not start with "." is a pattern on the file NAME
      # (`Dockerfile.*` matches `Dockerfile.prod`), checked before suffixes.
      extension_to_format: &doc_corpus_routes
        ".pyx": "text"
        ".ts": "text"
        ".tsx": "text"
        ".js": "text"
        ".jsx": "text"
        ".go": "text"
        ".rs": "text"
        ".rb": "text"
        ".java": "text"
        ".kt": "text"
        ".c": "text"
        ".h": "text"
        ".cc": "text"
        ".cpp": "text"
        ".hpp": "text"
        ".sh": "text"
        ".bash": "text"
        ".sql": "text"
        ".proto": "text"
        ".j2": "text"
        ".tpl": "text"
        ".tmpl": "text"
        ".dockerfile": "text"
        ".mk": "text"
        "Dockerfile": "text"
        "Dockerfile.*": "text"
        "Containerfile": "text"
        "Makefile": "text"
        "makefile": "text"
        "GNUmakefile": "text"
        "Jenkinsfile": "text"
      # Deliberately NOT `*repo_excludes`: this source stores file CONTENTS,
      # so it must exclude more than the source that stores file identity. A
      # path listed below is still a `source_file` node carrying its path,
      # size and language -- the graph knows the file exists -- but its bytes
      # are never stored and never indexed.
      #
      # This is NOT a secret scanner. The substrate has no ingest-time
      # credential detection at all, so a key committed under an ordinary name
      # reaches the graph AND its search index, where it becomes findable
      # rather than merely present. A deployment whose repository is private,
      # or whose graph readers are not its committers, must narrow
      # `include_globs` or drop this source.
      exclude_globs:
        # Paths whose contents ARE credentials.
        - "**/.env"
        - "**/.env.*"
        - "**/*.pem"
        - "**/*.key"
        - "**/*.p12"
        - "**/*.pfx"
        - "**/*.keystore"
        - "**/*.jks"
        - "**/id_rsa*"
        - "**/id_ed25519*"
        - "**/secrets/**"
        - "**/secret/**"
        - "**/credentials/**"
        - "**/*credentials*"
        - "**/*.secret"
        - "**/.npmrc"
        - "**/.pypirc"
        - "**/.netrc"
        - "**/kubeconfig"
        - "**/*.kubeconfig"
        # Everything the identity source skips, for the same reasons.
        - "__pycache__/**"
        - "**/__pycache__/**"
        - ".venv/**"
        - "**/.venv/**"
        - "node_modules/**"
        - "**/node_modules/**"
        - ".git/**"
        - "**/.git/**"
        - ".mypy_cache/**"
        - "**/.mypy_cache/**"
        - ".pytest_cache/**"
        - "**/.pytest_cache/**"
        - ".claude/**"
        - "**/.claude/worktrees/**"
        - "data/**"
        - "bench/deployments-generated/**"
        - "**/bench/deployments-generated/**"
        - ".scratch/**"
        - ".tmp/**"
        - ".artifacts/**"
        - "memories/**"
        - "**/*.pyc"
      # Counted over git-tracked files after the globs (oversize files count).
      # 3,000 refused ordinary repositories: this one has 11,615 tracked files
      # under the include globs above (2026-09-23). 25,000 matches the
      # DocCorpusSource default and still refuses a runaway corpus.
      max_files: 25000
      # A larger file is recorded as an `oversize` document (no text read)
      # and counted, not fatal.
      max_bytes_per_file: 5242880
      # A file whose structured parse fails -- a Python 2 script, a Helm or
      # Jinja template saved as `.yaml` -- is stored as plain text with a
      # `text_fallback:<format>` warning instead of `parse_failed` and no
      # text. A `code_repos` block that expands `doc-corpus` inherits this.
      text_fallback: true
      git_frontier_skip: true
      predecessor_source: "{{ deployment_name }}.git-files"
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [repo, path]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation

  # {{ if notes_root }}
  notes-doc-corpus:
    module: okg.substrate.library.sources.doc_corpus
    class: DocCorpusSource
    ownership_id: "{{ deployment_name }}.notes-doc-corpus"
    params:
      repo: "{{ deployment_name }}"
      repo_root: "{{ notes_root }}"
      extractors_dir: "{{ deployment_dir }}"
      include_globs: *doc_corpus_include
      # Same routes as the doc-corpus block: without them a matched file with
      # no parser becomes a document that stores no text.
      extension_to_format: *doc_corpus_routes
      exclude_globs:
        - "**/__pycache__/**"
        - "**/.venv/**"
        - "**/node_modules/**"
        - "**/.git/**"
        - "**/*.pyc"
      max_files: 3000
      max_bytes_per_file: 5242880
      # A notes directory is often not a git checkout. Where git does see
      # it, doc-corpus still reads only files git tracks.
      non_git_walk: true
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [repo, path]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation

  # {{ endif notes_root }}
  # {{ if openspec_enabled }}
  openspec:
    module: okg.substrate.library.sources.openspec
    class: OpenSpecSource
    ownership_id: "{{ deployment_name }}.openspec"
    params:
      repo: "{{ deployment_name }}"
      openspec_root: "{{ openspec_root }}"
      include_archived: true
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [repo, node_id]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    sync:
      watch:
        roots: ["__OKG_REPO_ROOT__/openspec"]
        include_globs: ["**/*"]
        exclude_globs: ["**/__pycache__/**", "**/*.pyc"]
      triggers: [fs_event, manual, reconcile]
      default_event_mode: scope_complete
      reconcile_mode: scope_complete
      deletes_require_reconcile: true
      cheap_probe: content_hash

  # {{ endif openspec_enabled }}
  git-history:
    module: okg.substrate.library.sources.git_graph_history
    class: GitHistorySource
    ownership_id: "{{ deployment_name }}.git-history"
    params:
      repo: "{{ deployment_name }}"
      repo_root: "{{ repo_root }}"
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [repo, node_id]
    source_revision_kind: version_token
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    sync:
      watch:
        roots: ["__OKG_REPO_ROOT__"]
        include_globs: [".git/HEAD", ".git/refs/**", ".git/packed-refs"]
        exclude_globs: []
      triggers: [git_ref_change, manual, reconcile]
      default_event_mode: cursor
      reconcile_mode: scope_complete
      deletes_require_reconcile: true
      cheap_probe: git_refs
      scope:
        accepts: [path]
        unsupported_fallback: scope_complete

  compute-env-local:
    module: okg.substrate.library.sources.compute_env_local
    class: LocalEnvSource
    ownership_id: "{{ deployment_name }}.compute-env-local"
    params:
      repo: "{{ deployment_name }}"
    source_class: reference_catalog
    record_identity_kind: domain_key
    record_identity_fields: [repo, node_id]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    sync:
      # LocalEnvSource probes host/runtime/MCP state as one current
      # environment snapshot. There is no safe path key that represents a
      # partial machine probe, so it stays poll/manual/reconcile only.
      triggers: [poll, manual, reconcile]
      default_event_mode: scope_complete
      reconcile_mode: scope_complete
      deletes_require_reconcile: true
      cheap_probe: ttl
