- migration_id: 0023_generation_identity_text_refs
  file: 0023_generation_identity_text_refs.sql
  checksum_sha256: 1970747d6b6349651bcddd7c053f964220207b113dbffb0925f3d62f59220ba0
  title: Key the granted surface's generation references on the TEXT checkpoint ref
  applicability: always
  prerequisites:
  - migration 0018_promotion_fence_release_receipt is applied
  - the okg schema exists
  # Merge-train position, not a code dependency. Quoted because a bare "#" opens
  # a YAML comment and would silently eat the PR numbers. PR #1074 took 0019,
  # PR #1055 took 0020, PR #1069 took 0021 and PR #1064 took 0022; all four are
  # now on dev, so this migration lands last in the train.
  - 'merge after PR "#1069" (0021), PR "#1064" (0022)'
  # NOT flagged destructive, deliberately and against first instinct: this
  # migration DROPs okg.admission_envelopes.target_generation_id. The runner
  # derives `destructive` from the filename heuristic (retire_/drop_/remove_
  # prefixes) and refuses a manifest entry that disagrees with it, and a
  # destructive migration is auto-SKIPPED — which would leave the upgrade path
  # permanently diverged from a fresh install and red the migration-convergence
  # lane. That argues the heuristic is too coarse, not that a DROP COLUMN is
  # harmless, so the drop is made non-destructive IN FACT rather than by label:
  # the guarded UPDATE above it copies the token into target_generation_ref for
  # every envelope that carries only the token, so no row loses its generation
  # linkage. The publisher's lens-promotion finalize pass keeps a per-cycle
  # correlator (verdict.applied.cycle_token) that used to live in this column;
  # that is provenance payload, not a generation identity column.
  destructive: false
  destructive_approval: not_required
  squawk:
    expected_findings:
    - rule: ban-drop-column
      reason: >-
        okg.admission_envelopes.target_generation_id is the legacy numeric
        compatibility token that D2 retires; target_generation_ref carries the
        same fact and is written by every producer path.
    - rule: require-concurrent-index-creation
      reason: >-
        The dedupe and pin indexes are re-created inside the same transaction
        that retypes their column, so CONCURRENTLY is not available.
  schema_diff:
    mode: required
    reason: >-
      Fresh install and upgraded database must agree on the generation-reference
      column types, or the migration-convergence lane diverges.
- migration_id: 0024_canonical_read_path_view_cleanup
  file: 0024_canonical_read_path_view_cleanup.sql
  checksum_sha256: 61a5b79c3e5bb59bf317714432d76b44356a2e9ea5decb9e3e364560d38700d1
  title: Retire the fake history views and the projectable-fact stubs
  applicability: always
  prerequisites:
  - the okg schema exists
  # NOT flagged destructive, for the reason 0023 records: the generic runner
  # auto-SKIPS a destructive migration, which would leave every upgraded
  # database carrying views a fresh install does not have — permanent
  # divergence, and a red migration-convergence lane. The label must describe
  # the effect. The effect is five view drops and one function drop; no table,
  # no column, no row. Every fact these views projected stays readable from the
  # relations they read, which is what makes the drop non-destructive IN FACT
  # rather than by label. The filename avoids the `retire_` prefix for the same
  # reason: the runner refuses when the manifest and the filename heuristic
  # disagree, and the heuristic reads that prefix as destructive.
  destructive: false
  destructive_approval: not_required
  squawk:
    expected_findings: []
  schema_diff:
    mode: required
    reason: >-
      Decision D6 retires these views from the v1.0 surface. A fresh install
      never creates them; an upgraded database must not keep them, or the two
      disagree about what the granted read surface contains.
- migration_id: 0025_dead_relation_and_constraint_convergence
  file: 0025_dead_relation_and_constraint_convergence.sql
  checksum_sha256: e1a404c7a16853526110032ebf7e25e43174a0af574206226b2bdc91568e3409
  title: Retire the zero-consumer relations and validate the born-VALID constraints
  applicability: always
  prerequisites:
  - the okg schema exists
  # Ordinal reservation, not a code dependency. Quoted because a bare "#" opens
  # a YAML comment and would silently eat the PR numbers. 0024 is held by the
  # canonical-read-path lane, which is in flight and unmerged; this change was
  # assigned 0025 up front so the two cannot collide. 0024 being absent from
  # the tree when this lands is expected and harmless -- the runner enumerates
  # the NNNN files that exist and orders them, it does not require a dense
  # sequence. Resolve any merge conflict in the pinned lists by TAKING BOTH
  # SIDES and recomputing the count from the migrations directory; never
  # renumber an ordinal that has already been applied to a database.
  - 'ordinal "#0024" is reserved by the canonical-read-path lane'
  # NOT flagged destructive, deliberately: this migration DROPs two tables and
  # two functions. The runner derives `destructive` from the filename heuristic
  # (retire_/drop_/remove_ slug prefixes) and refuses a manifest entry that
  # disagrees with it, and a destructive migration is auto-SKIPPED behind an
  # operator-confirmed adapter -- which would leave every upgraded database
  # carrying relations no fresh install has, permanently reddening the
  # migration-convergence lane with nothing able to clear it. Same argument as
  # 0023. The drops are made safe IN FACT rather than by label: a per-relation
  # consumer re-verification at HEAD (rg over src/, tests/, deployments/,
  # scripts/, ops/) found no reader, no writer, and no dependent view for any
  # of the four objects, and the drops are RESTRICT (the default), so an
  # unaudited dependency BLOCKS the migration instead of being silently removed
  # by CASCADE. okg.lease_audit -- the audit's third named table -- is NOT
  # dropped, and NOT because anything depends on it in the catalog sense: the
  # inventory view that names it stores a string, never selects it, so the
  # drop would succeed. It is kept because four places still reference it
  # (the app_ro-published okg.v_runtime_lock_surface_inventory row marked
  # table_backed = true, the test that pins that row, the conftest truncation
  # list, and the clone/relation-family dispositions), and dropping the table
  # without fixing the inventory would leave app_ro readers told a relation
  # exists that no longer resolves. The inventory row lives in views.sql,
  # owned by the canonical-read-path lane.
  destructive: false
  destructive_approval: not_required
  squawk:
    expected_findings:
    - rule: ban-drop-table
      reason: >-
        okg.pagerank_scores and okg.verifier_runs are the audited zero-consumer
        relations this change retires; the drop is the whole point of the
        migration, and RESTRICT blocks on any dependency the audit missed.
  schema_diff:
    mode: required
    reason: >-
      A fresh install no longer creates these relations and now creates six of
      the seven formerly-NOT VALID CHECK constraints born VALID; an upgraded
      database must reach the same shape or the migration-convergence lane
      diverges. The seventh is a registered exemption
      (src/okg/substrate/db/not_valid_exemptions.yaml) and is NOT VALID on
      both sides, so it converges too.
- migration_id: 0026_identity_branch_and_deployment_names
  file: 0026_identity_branch_and_deployment_names.sql
  checksum_sha256: bbac38c18509f8f039d1b6929cf3102fee3810e415e051a03a2f5af97dac32b9
  title: Rename chronos branch ids and bare deployment columns to the v1.0 convention
  applicability: always
  prerequisites:
  - migration 0023_generation_identity_text_refs is applied
  - the okg schema exists
  # Ordinal pinned from disk: 0023 is the highest ordinal on dev, and 0024 and
  # 0025 are RESERVED by the two sibling lanes running concurrently against this
  # same freeze --- schema-canonical-read-path (0024) and
  # schema-dead-weight-retirement (0025). Quoted because a bare "#" would open a
  # YAML comment and silently eat the PR numbers.
  - 'ordinals "#0024" and "#0025" are reserved by the canonical-read-path and
    dead-weight-retirement lanes; this migration takes 0026 and depends on
    neither'
  # TWO-ORDER REQUIREMENT, stated because the runner does not enforce it.
  # Reserving a LOWER ordinal for an unwritten migration inverts the usual
  # guarantee: on a FRESH install 0024/0025 execute BEFORE 0026, but on a
  # database that already applied 0026 they execute AFTER it. The runner
  # validates checksum, destructive flag, class and explicit "migration <id> is
  # applied" prerequisites only -- it has no ordinal-regression refusal -- so
  # nothing mechanically stops a sibling migration that is correct in one order
  # and wrong in the other. Both sibling lanes must therefore be correct against
  # BOTH the pre-rename and the post-rename shape of the ten deployment_name
  # tables and okg.history_compaction_plans, or must declare an explicit
  # "0026_identity_branch_and_deployment_names is applied" prerequisite to pin
  # the order.
  - 'siblings taking "#0024"/"#0025" must be correct BOTH before and after this
    migration, or declare it as an explicit prerequisite'
  destructive: false
  destructive_approval: not_required
  squawk:
    expected_findings: []
  schema_diff:
    mode: required
    reason: >-
      Fresh install and upgraded database must agree on the branch and
      deployment column NAMES, or the migration-convergence lane diverges. The
      renames are catalog-only (ALTER TABLE ... RENAME COLUMN carries dependent
      indexes, constraints and view bodies), so no table is rewritten.
