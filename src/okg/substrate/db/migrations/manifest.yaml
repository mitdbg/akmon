- migration_id: 0032_withheld_enricher_progress_status
  file: 0032_withheld_enricher_progress_status.sql
  checksum_sha256: 3384d30ae31b04bdc25427f31e0ec7c267c1fe0897c5a9a5ac85035cb723e94f
  title: Admit a withheld enricher run into the enricher_progress status vocabulary
  applicability: always
  prerequisites:
  - migration 0031_bounded_record_authority is applied
  - okg.enricher_progress exists
  destructive: false
  destructive_approval: not_required
  squawk:
    expected_findings:
    - rule: constraint-missing-not-valid
      reason: >-
        Warning-only. The CHECK is added without NOT VALID on purpose: it only
        WIDENS the accepted set (it adds `withheld:%` to the existing
        'never'/'success'/`failed:%`), so no existing row can violate it and
        the validating scan cannot fail. Splitting into NOT VALID + VALIDATE
        would take the same ACCESS EXCLUSIVE lock to attach the constraint
        while leaving a window in which the publisher's new `withheld:%` write
        is rejected. enricher_progress holds one row per enricher per
        deployment -- tens of rows -- so the scan is bounded, and the migration
        caps its exposure with lock_timeout 5s / statement_timeout 30s.
  schema_diff:
    mode: required
    reason: >-
      Fresh installs and upgraded deployments must accept the same
      enricher_progress.last_status values. Without this a deployment that was
      upgraded rather than reinstalled rejects the withheld status the
      publisher now writes, and the publish fails on the constraint.

