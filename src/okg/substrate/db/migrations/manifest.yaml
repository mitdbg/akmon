  # present in src/okg/substrate/db/migrations, so this takes 0027. Quoted
  # because a bare "#" would open a YAML comment and silently eat the numbers.
  - 'ordinal "#0027" recomputed from the migrations directory at HEAD; the
    runner orders the NNNN files that exist and does not require a dense
    sequence'
  # ORDER-INDEPENDENT BY CONSTRUCTION. Both statements are CREATE ... IF NOT
  # EXISTS against relations schema.sql already authors, so this migration is
  # correct whether it runs before or after any sibling ordinal, and is a no-op
  # on a fresh install.
  destructive: false
  destructive_approval: not_required
  squawk:
    expected_findings: []
  schema_diff:
    mode: required
    reason: >-
      A fresh install (schema.sql) and an upgraded database (this migration)
      must agree on okg.grant_registry and okg.pending_grants, or views.sql's
      registry seed applies on one and silently no-ops on the other --- which
      is exactly the order-dependent grant surface this PACT removes.
