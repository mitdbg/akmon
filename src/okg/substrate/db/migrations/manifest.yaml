- migration_id: 0043_attr_index_teardown
  file: 0043_attr_index_teardown.sql
  checksum_sha256: da7e12760f892a4922f815dba5b754b5ed25fd5199ee9b3ee2e82f1aa7b94fae
  title: Drop okg.attr_index, its coverage markers, rebuild queue and derive front
  applicability: always
  prerequisites:
  - the okg schema exists
  - migration 0041_blob_store is applied (ordering only; no data dependency)
  # Ordinal reservation, not a code dependency. Quoted because a bare "#" opens
  # a YAML comment. 0038 is reserved by lane C (#3157) and 0042 is taken by
  # 0042_catalog_ownership_events on another branch, so this change takes 0043.
  # Resolve any merge conflict in the pinned lists by taking both sides and
  # recounting the migrations directory; never renumber an applied ordinal.
  - 'ordinals "#0038" and "#0042" are reserved by other lanes; this migration takes 0043'
  # NOT flagged destructive, by decision 304 (D4), on the argument of
  # 0023-0025: a destructive migration is auto-skipped behind an
  # operator-confirmed adapter, so upgraded databases would keep tables a
  # fresh install drops and the migration-convergence lane would stay red.
  # The rows are derived: each was projected from the interval rows in
  # okg.attribute_effective_view_intervals, which stay. okg#3112 step 4b
  # removed every reader and writer, and the drops are RESTRICT, so an
  # unaudited dependency blocks the migration. It frees about 11.7 GB on
  # krama; the operator approves it knowing that.
  destructive: false
  destructive_approval: not_required
  squawk:
    expected_findings:
    - rule: ban-drop-table
      reason: >-
        okg.attr_index and its three issue-#3029 side tables are the derived
        filter index okg#3112 step 4 retires; the drop is the whole point of
        the migration, nothing reads or writes them after step 4b, and RESTRICT
        blocks on any dependency the audit missed.
  schema_diff:
    mode: required
    reason: >-
      The runtime schema ensure no longer creates these objects, and 0021 and
      0036 still create them on a fresh install, so fresh and upgraded
      databases must both run this drop to converge on their absence.
