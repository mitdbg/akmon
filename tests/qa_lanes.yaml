# Test lanes of the public mirror. GENERATED by the release export from the
# upstream development repository's fast lane: the test paths that ship and
# the lane's marker expression. scripts/mirror_fast_lane.py runs it.
version: 1
report_dir: .scratch/qa
lanes:
  fast:
    description: Broad no-database Python lane.
    steps:
    - name: pytest
      kind: pytest
      paths:
      - tests/acceptance
      - tests/architecture/test_ingest_planning_boundaries.py
      - tests/architecture/test_no_shadowed_definitions.py
      - tests/architecture/test_run_gates_refuses_consistency_gates.py
      - tests/architecture/test_source_sync_optimization_ledger_boundaries.py
      - tests/architecture/test_source_sync_status_boundaries.py
      - tests/bench
      - tests/captioning/test_doc_corpus_images.py
      - tests/captioning/test_doc_corpus_pdf_embedded.py
      - tests/captioning/test_doc_corpus_visual_artifacts.py
      - tests/captioning/test_vision_config.py
      - tests/cli
      - tests/deployment
      - tests/deployments
      - tests/docs
      - tests/e2e
      - tests/formal
      - tests/integration
      - tests/pact
      - tests/operator_ui/test_deployment_theme.py
      - tests/operator_ui/test_console_bundle_has_no_document_viewers.py
      - tests/pytest/test_tracked_files.py
      - tests/pytest/test_child_pythonpath.py
      - tests/scripts
      - tests/release
      - tests/substrate
      - tests/test_coverage_area_floors.py
      - tests/test_mirror_scope.py
      - tests/test_optional_deployments.py
      - tests/views
      markers: not postgres and not slow and not perf and not optional_deployment
        and not browser and not dbos_integration and not integration
      args:
      - -q
      - --no-cov
      - --tb=short
      - --dist=loadscope
      - --durations=20
      xdist: auto
