      Issue #1792. The one guided entry point: stand-up, admin bootstrap,
      provider registration by secret reference, model and graph-endpoint
      readiness, sync, and the tool-attached conversation probe that
      separates configuration convergence from conversation readiness.
  chat codex-shim:
    test_file: tests/substrate/chat/test_codex_shim.py
    notes: |
      PACT chat-codex-cli-provider-shim. A loopback OpenAI-compatible
      endpoint that answers each chat completion with one read-only,
      shell-less `codex exec --json` run; tests drive it against a fake
      codex executable replaying a recorded event stream.
  chat sync:
    test_file: tests/substrate/test_chat_sync_projection.py
  chat plan:
    test_file: tests/substrate/test_chat_plan_apply_readback.py
    notes: |
      PACT chat-plan-apply-readback. Writes the manifest-derived desired
      state without contacting an instance; the behavioral home covers
      byte-identity on re-run, secret-freedom, and the pre-existing-path
      refusal.
  chat readback:
    test_file: tests/substrate/test_chat_plan_apply_readback.py
    notes: |
      PACT chat-plan-apply-readback. Compares a live instance against a
      plan and writes chat-readback.json. The read-only claim is checked
      against the fake's request log, not asserted.
  chat sso-check:
    test_file: tests/substrate/cli/test_low_coverage_verb_smoke.py
    notes: >-
      PACT chat-sso-integration. The verb shipped with no test naming it —
      tests/substrate/test_chat_sso_config.py covers the sso module and the
      manifest parsing, never the CLI verb. Routed to the low-coverage
      default (fails predictably without a DSN) rather than pointed at a
      file that does not exercise it. A behavioral home belongs with
      task.chat-sso-integration.proxy-integration, which is still todo.
  chat-instance:
    role: not_entry
    test_file: tests/substrate/chat/test_instance_lifecycle.py
    notes: >-
      PACT chat-instance-lifecycle. Stands up a deployment's Open WebUI
      instance and its per-deployment Postgres app database, supervises
      the process, and renders the single-operator front door. Separate
      top-level verb rather than a `chat` sub-verb because `chat` reads
      and configures an instance that already exists, while this creates
      one — the producer every other live proof in the program consumes.
  chat-instance up:
    test_file: tests/substrate/chat/test_instance_lifecycle.py
  chat-instance status:
    test_file: tests/substrate/chat/test_instance_ports_supervision.py
    notes: >-
      Status shares a home with supervise because supervision is what
      reads it: the restart arm asserts down before and up after, so the
      status path is exercised on both sides of a real SIGKILL rather
      than only on a healthy instance.
  chat-instance supervise:
    test_file: tests/substrate/chat/test_instance_ports_supervision.py
  chat-instance down:
    test_file: tests/substrate/chat/test_instance_lifecycle.py
  chat-instance front-door:
    test_file: tests/substrate/chat/test_instance_front_door.py
  chat-instance lifecycle-receipt:
    test_file: tests/substrate/test_chat_lifecycle_receipts.py
    notes: >-
      PACT chat-layer-lifecycle. Writes an inert upgrade, rollback or
      retire receipt for the chat layer. The behavioural home is the
      receipt suite rather than a CLI test because the verb is a thin
      wrapper: every refusal it can produce is raised by the builders,
      and the retire arms need an instance that genuinely held the
      surfaces before they were removed.
