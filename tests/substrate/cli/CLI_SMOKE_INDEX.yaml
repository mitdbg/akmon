# CLI smoke-test coverage manifest.
#
# Per `audit-test-and-document-cli-surface` Phase 2: every verb in
# the substrate's argparse tree SHALL appear here, mapped to a
# test file that exercises it. Adding a verb without updating this
# file fails `test_cli_surface_coverage.py`.
#
# Layering:
#   - `test_cli_smoke.py` runs a UNIVERSAL parametrized check for
#     every argparse verb (--help exits 0; verb is in subparsers).
#     It doesn't read this manifest; verbs are discovered straight
#     from `_build_parser()`. Re-routing a manifest entry away
#     from `test_cli_smoke.py` does NOT remove that verb's smoke.
#   - `test_file` here names the canonical BEHAVIORAL home (no-DSN
#     failure, happy path, regression cases).
#   - `test_low_coverage_verb_smoke.py` is the default behavioral
#     destination for verbs whose only real check is "fails
#     predictably without DSN" or "succeeds without state".
#
# Comments document edge-case mocking notes.
#
# ─── `role:` — the entry surface, per PACT define-newcomer-entry-path ───
#
# Every TOP-LEVEL verb carries a role. Sub-verbs do not: "which command
# does a newcomer type first" is a property of the top-level surface.
# A top-level verb with no role fails `test_cli_surface_coverage.py` —
# it must be classified explicitly, never defaulted, because silently
# defaulting is how the entry surface grew several front doors without
# anything noticing.
#
# A DOOR is a verb a newcomer plausibly types FIRST to obtain a working
# graph — NOT merely any verb that can result in one. The loose reading
# admits half the CLI and makes the role meaningless.
#
#   newcomer_bring_up  The ONE documented way in. Exactly one verb.
#   superseded_entry   Also a door a newcomer might type first, but not the
#                      documented one. Migration to alias/frozen/deleted
#                      is pending; the count is a ratchet that may fall
#                      but never rise.
#   alias              Delegates to the newcomer door and reaches the
#                      same end state. Requires `alias_of:`.
#   frozen             Still executes, but emits a migration notice
#                      naming its replacement. Requires `replaced_by:`.
#   lifecycle          Operates an EXISTING deployment (start/stop/up).
#                      Deliberately OUTSIDE the alias/frozen/delete
#                      trichotomy: `start` is the only day-2 capability
#                      the newcomer path has, added by `dead-simple-install`
#                      because "after reboot, the container stops", and
#                      freezing it would delete the reboot story.
#   not_entry          Cannot begin a bring-up.
#
# Classification is grounded in probes, not in a verb's name or help text.
# Each of these was checked by RUNNING it, and three were misclassified on
# an earlier reading of their help strings alone:
#
#   provision          NOT a door — exits "deployment dir for 'X' not
#                      found", so it presumes a scaffold already exists.
#   fetch-deployments  NOT a door — clones the reference-deployment cache
#                      and creates no deployment. A prerequisite step, and
#                      `install --profile` names it in the error at the
#                      moment it is needed.
#   snapshot-load      NOT a door — can publish a first generation from a
#                      JSON file, but a newcomer has no snapshot. An
#                      import/restore capability.
#   deployment         NOT a door — its door is three levels down at
#                      `deployment bootstrap apply`, a deliberate authoring
#                      workflow (plan/draft/verify/apply) for someone
#                      designing a deployment, not a first command.

# ─── `visibility:` — default `okg --help` listing, per okg#3109 slice 0 ───
#
# Optional, top-level verbs only. `hidden` leaves a verb out of the default
# `okg --help` listing; it still parses, runs, and answers `--help`.
# Absent means `shown`. Mirrors `entry_roles.HIDDEN_FROM_DEFAULT_HELP`, and
# `test_cli_surface_coverage.py` asserts the two agree. `retired` (issue
# #2479) also leaves the listing, is not named in the epilog, and mirrors
# `entry_roles.RETIRED_VERBS`; such a verb only refuses.
# `unlisted` (issue #3416) also leaves the listing and is not named in the
# epilog, but runs as before; it mirrors `entry_roles.UNLISTED_VERBS`.

