api_version: okg.environment/v1
id: fixture-production
tier: production
graph_deployment_name: fixture-graph
definition:
  path: ../shared-definition/definition.yaml
database:
  dsn_secret_ref: env:TEST_PRODUCTION_DSN
  name: fixture_production
  container: fixture-production-postgres
  volume: fixture-production-postgres-data
  host_port: 55434
  dbos_identity: fixture-production:dbos
release:
  mode: sealed
  artifact_store: ${TEST_STATE_ROOT}/artifacts
  active_pointer: ${TEST_STATE_ROOT}/environments/fixture-production/active.json
  previous_pointer: ${TEST_STATE_ROOT}/environments/fixture-production/previous.json
runtime:
  worker_service: org.okg.runtime-worker.fixture-production
  state_root: ${TEST_STATE_ROOT}/environments/fixture-production
  local_env_file: ${TEST_STATE_ROOT}/environments/fixture-production/local.env
  log_root: ${TEST_STATE_ROOT}/environments/fixture-production/logs
  config:
    enabled: false
ui:
  service: org.okg.ui.fixture-production
  host: 127.0.0.1
  port: 18770
webhook:
  service: org.okg.webhook.fixture-production
  host: 127.0.0.1
  port: 8088
mcp:
  transport: stdio
  registration_id: fixture-production
  launcher_environment: fixture-production
readiness:
  policy: dogfood
  evidence_ref:
    store: runtime_state
    path: readiness/current.json
    max_age_seconds: 900
