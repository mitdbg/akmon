# Two deployment-private system subtypes and the live relations each may be
# asked (PACT live-relation-mcp-adapter, req.mcp.real-upstream).
#
# A TEST FIXTURE with neutral names. These two classes exist so the
# `kind: mcp` adapter can be proved against an in-process fake MCP server.
# A site that runs real MCP servers declares its own systems in its own
# deployments repository.
#
# Both classes are new to the catalog, so the composer copies them in whole;
# `archetype` is what makes a class a subtype at all.
#
# `retention_class: hot` on both: the answers are read with one person's
# credential (see `upstream_credential` in deployment.yaml), and the sample is
# kept for seven days to prove the call happened, not to build a history of
# what the catalog held.
id: https://palimpzest.mit.edu/okg/deployments/live_mcp_example
name: live_mcp_example_systems
title: "Two catalog systems and what each may be asked"
description: |-
  An item catalog and a location store, each with live relations served by
  the built-in `mcp` adapter.
prefixes:
  linkml: https://w3id.org/linkml/
  okg: https://palimpzest.mit.edu/okg/
default_range: string
imports:
- linkml:types
classes:
  CatalogInstance:
    description: >-
      One item catalog instance. The graph keeps that it exists; the items it
      lists are read live.
    annotations:
      archetype: resource
      transient: 'false'
      okg_searchable_text_fields: instance_name
      okg_live_relations:
        items:
          action: external.example.catalog.read
          principal_mode: service
          sample_policy: inline
          retention_class: hot
          # The longest deadline a relation may declare. A wide query is
          # assembled on the server before its first byte arrives; the byte
          # cap, not the clock, is what bounds the answer.
          deadline_seconds: 120
          args:
            # `*` is accepted as a wildcard in an item name.
            name_pattern:
              type: string
              required: true
              maxLength: 99
              pattern: '^[A-Za-z0-9_*-]{1,99}$'
            detail:
              type: boolean
              default: false
        # The narrow question: items matching a full path, `*` allowed in
        # each part, listed WITHOUT detail (the binding fixes detail=false).
        # An exact path is one item. Same tool, a different relation, so a
        # caller cannot widen it into the detailed search above.
        item:
          action: external.example.catalog.read
          principal_mode: service
          sample_policy: inline
          retention_class: hot
          deadline_seconds: 60
          args:
            path:
              type: string
              required: true
              maxLength: 350
              pattern: '^/[A-Za-z0-9_.*-]{1,99}/[A-Za-z0-9_.*-]{1,199}/[A-Z0-9*-]{1,49}$'
    attributes:
      instance_name:
        range: string
  StoreInstance:
    description: >-
      One location store instance. Its locations are read live, filtered by
      an expression whose atoms combine with `&`, `|` and parentheses, as in
      `zone=1&kind=disk`.
    annotations:
      archetype: resource
      transient: 'false'
      okg_searchable_text_fields: instance_name
      okg_live_relations:
        locations:
          action: external.example.store.read
          principal_mode: service
          sample_policy: inline
          retention_class: hot
          deadline_seconds: 60
          args:
            # Attribute atoms combined with `&`, `|` and parentheses, such as
            # `zone=1` or `kind=disk`.
            expression:
              type: string
              required: true
              maxLength: 128
              pattern: '^[A-Za-z0-9_=&|()-]{1,128}$'
            limit:
              type: integer
              default: 50
              minimum: 1
              maximum: 500
    attributes:
      instance_name:
        range: string
