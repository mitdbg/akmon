      - pact/changes/s14-2127-install-release-shape
    fix_hint_template: "check deployments/<name>/ exists or OKG_DEPLOYMENTS_DIR"
    # `data_shape` lists the keys EVERY raiser sets, so it stays at two.
    # The scaffold raiser (`deployments_env_root_error`, used by okg install
    # and okg init) adds `env_var: OKG_DEPLOYMENTS_DIR`, and reports
    # `deployment: null` because it refuses before any deployment is
    # resolved -- the root itself is what could not be found.
    data_shape: [deployment, resolution_error]

