# OKG substrate error-code registry.
#
# Every failure the substrate emits on stderr (with --json) or as a
# Python exception must have an entry here. This file is the
# authoritative list; if a code appears in a runbook, contract, or
# agent spec and is not here, that reference is a bug.
#
# Fields:
#   code:               stable string emitted in JSON error payloads
#   python_exception:   class name if the code maps to a Python exception
#   severity:           fatal | recoverable | user
#   raised_by:          command(s) and/or substrate phases that raise this
#   referenced_in:      docs that normatively mention this code
#   fix_hint_template:  string template (positional {0}, {1}, ...)
#                       that okg CLI may substitute into the fix_hint
#                       field of the JSON error. `null` = no hint.
#   data_shape:         required keys in the error's `data` field
#
# Documentation and Python contract checks keep emitted codes and their
# consumer references aligned with this registry.

version: 1

codes:

  - code: agent_connect_ephemeral_okg
    python_exception: null
    severity: user
    raised_by:
      - okg agent connect
    referenced_in:
      - docs/reference/cli.md
    fix_hint_template: "install okg as a lasting tool first (`uv tool install <okg wheel or source>` or `pipx install <okg wheel or source>`), then re-run this command with that install's `okg`"
    data_shape: [interpreter, cache_root]

  - code: agent_connect_writes_need_role_passwords
