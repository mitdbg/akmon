  # A DENY, not a raise: the call comes back in its `external_live` envelope
  # with `state: denied` and a sample row of its own, so there is no exception
  # class. Recorded when the subject does not resolve -- the dispatcher used to
  # read an empty principal as the privileged service subject, which is
  # the wrong direction for a gate that otherwise fails closed. The gate is not
  # even asked: a call with no identity is not a policy question.
  # An external-backed `sql` probe whose query is not exactly one plain,
  # read-only SELECT. The query comes from a node's handle
  # and runs on the MCP read pool; `SET TRANSACTION READ ONLY` alone does not
  # stop `COMMIT; INSERT ...`. Checked with pglast before anything runs; the
  # field comes back `state: unavailable` with this code, the adapter never
  # runs and nothing is cached. `reason` names the rule broken.
  - code: external_probe_query_refused
    python_exception: ProbeQueryRefused
    severity: user
    raised_by:
      - okg.substrate.mcp.sql_safety.validate_probe_query
      - MCP inspect(node, hydrate) sql probe fields
    referenced_in: []
    fix_hint_template: "write the probe query as one plain SELECT: no second statement, no data-modifying WITH, no SELECT INTO, no FOR UPDATE, no deny-listed function"
    data_shape: [reason]

  - code: probe_principal_unresolved
    python_exception: null   # a denied probe field, not a raised error
    severity: recoverable
    raised_by:
      - okg.substrate.external_backed.resolver
    referenced_in:
      - docs/reference/mcp.md
    fix_hint_template: "set OKG_NOMOS_SUBJECT (or fix the MCP subject resolution) so the hydrating caller has a Nomos subject; the probe is never decided as the runtime service"
    data_shape: [reason, principal]

  - code: live_principal_unresolved
    python_exception: null   # a denied call, not a raised error
    severity: recoverable
    raised_by:
      - okg.substrate.external_backed.live_dispatch
    referenced_in:
      - docs/reference/mcp.md
    fix_hint_template: "declare `agent_surface.live_bindings.<relation>.service_principal`, or fix the identity resolution that returned nothing"
    data_shape: [reason, relation, principal, action]

  # Not a policy denial: no identity resolved, so Nomos is never asked. The
  # MCP read boundary, the source tools' visibility gate and the run_sql
  # audit record raise it; `record` returns it as its refusal code with
  # `evaluated: false` authority evidence. None of them writes a decision or
  # admission row. All resolve the subject through
  # okg.substrate.nomos.mcp_subject in one order: OKG_NOMOS_SUBJECT /
  # OKG_MCP_NOMOS_SUBJECT / OKG_PRINCIPAL, then the rollout baseline default
  # subject:mcp_client, then the process login name. A failure to read the
  # active policy during that lookup is authority_evaluation_failed (or
  # authority_unavailable), never a quiet switch to the login name.
  - code: mcp_principal_unresolved
    python_exception: null   # attached per instance; record refuses, not raises
    severity: recoverable
    raised_by:
      - MCP graph-read runtime authority boundary (single-operator)
      - MCP record (write actions)
      - MCP source tools (list_sources, source_status, coverage source visibility)
      - MCP run_sql graph-backed audit record
    referenced_in:
      - docs/runbooks/security/nomos.md
    fix_hint_template: "set OKG_NOMOS_SUBJECT to a subject the deployment's active policy grants"
    data_shape: [surface_or_action, message]

  # NOT user severity. The call ran (or was denied) and its record could not
  # be written, which is an operational failure of this deployment, not
  # something the caller can fix by changing the call.
  - code: live_sample_write_failed
    python_exception: LiveSampleWriteFailed
    severity: recoverable
    raised_by: [okg.substrate.external_backed.live_dispatch]
    fix_hint_template: "check the call-sample hypertable for the relation's retention class and the deployment's write connection"
    data_shape: [relation, node_id, adapter_ran, event]

  # A binding that can never dispatch. LOAD-time, like the rest: a
  # deployment whose adapter kind has no runner must not start believing it
  # serves that relation.
  - code: live_adapter_unavailable
    python_exception: LiveAdapterUnavailable
    severity: user
    raised_by: [okg.substrate.external_backed.live_dispatch]
    fix_hint_template: "register a runner for this kind, or remove the binding"
    data_shape: [relation, kind, registered]

  # The four LOAD-time refusals of a `kind: http` or `kind: mcp` binding. All
  # `user`: an operator wrote a binding that cannot produce a legal request,
  # and the deployment refuses to start rather than discovering it on an
  # agent's first call.
  - code: live_adapter_config_invalid
    python_exception: LiveAdapterConfigInvalid
    severity: user
    raised_by: [okg.substrate.external_backed.http_adapter, okg.substrate.external_backed.mcp_adapter]
    fix_hint_template: "correct the named field in the deployment manifest"
    data_shape: [relation, field, reason]

  # Carries the REFERENCE name and never the value. There is no value here,
  # which is the problem -- but the rule holds on every path, so there is no
  # path where it might not.
  - code: live_adapter_secret_missing
    python_exception: LiveAdapterSecretMissing
    severity: user
    raised_by: [okg.substrate.external_backed.http_adapter, okg.substrate.external_backed.mcp_adapter]
    fix_hint_template: "set the named environment variable, or drop the secret"
    data_shape: [relation, secret_ref]

  # The mechanism keeps argument bounds optional, which is right for a
  # mechanism. This adapter declines to slot an argument it cannot bound.
  - code: live_adapter_arg_unconstrained
    python_exception: LiveAdapterArgUnconstrained
    severity: user
    raised_by: [okg.substrate.external_backed.http_adapter, okg.substrate.external_backed.mcp_adapter]
    fix_hint_template: "add an enum, or a pattern and maxLength, to the argument"
    data_shape: [relation, argument, type]

  # The host carried here is the REDACTED url: a base_url with userinfo is
  # refused, and the refusal must not be the thing that prints the password.
  - code: live_adapter_host_refused
    python_exception: LiveAdapterHostRefused
    severity: user
    raised_by: [okg.substrate.external_backed.http_adapter, okg.substrate.external_backed.mcp_adapter]
    fix_hint_template: "allowlist the exact ip:port, as an IP literal"
    data_shape: [relation, host, reason]

  # A `kind: mcp` binding declares `upstream_credential: personal` on a
  # deployment whose `contract.lifecycle` is not `prototype` or `demo` (or
  # is undeclared). okg cannot inspect the credential an MCP server holds;
  # it enforces the declaration, at server build.
  - code: live_adapter_personal_credential_refused
    python_exception: LiveAdapterPersonalCredentialRefused
    severity: user
    raised_by: [okg.substrate.external_backed.mcp_adapter]
    fix_hint_template: "use a service credential, or declare the deployment prototype or demo"
    data_shape: [relation, lifecycle, admitted]

  # The process-wide cap on live calls in flight. Recoverable, not user:
  # the caller did nothing wrong and the same call will work once the
  # external system stops hanging.
  # What an adapter raises to say what went wrong SAFELY. The dispatcher
  # never passes an exception's own message through -- a network exception's
  # str() routinely embeds the URL it was dialling, userinfo included -- so
  # an adapter that wants to say more supplies a bounded excerpt, which is
  # redacted and fenced before it reaches the envelope.
  - code: live_adapter_error
    python_exception: LiveAdapterError
    severity: recoverable
    raised_by: [okg.substrate.external_backed.live_dispatch]
    fix_hint_template: null
    data_shape: []

  - code: live_concurrency_exhausted
    python_exception: LiveConcurrencyExhausted
    severity: recoverable
    raised_by: [okg.substrate.external_backed.live_dispatch]
    fix_hint_template: "retry once the external system recovers"
    data_shape: [limit]

  - code: live_relations_unbound_deployment
    python_exception: LiveRelationsUnboundDeployment
    severity: user
    raised_by: [okg.substrate.mcp.server]
    fix_hint_template: "declare the relation on the subtype and bind it in `agent_surface.live_bindings`, or drop the `live` argument"
    data_shape: [relation, bound, issue]

  - code: dsn_parse_error
    python_exception: DsnParseError
    severity: user
    raised_by: [okg.substrate.db.dsn]
    referenced_in:
      - pact/changes/dsn-module-parse-expand-redact
    fix_hint_template: "write the DSN as postgresql://user:password@host:port/dbname"
    data_shape: []

  - code: dsn_keyword_form
    python_exception: DsnFormError
    severity: user
    raised_by: [okg.substrate.db.dsn]
    referenced_in:
      - pact/changes/dsn-module-parse-expand-redact
    fix_hint_template: "write the DSN as postgresql://user:password@host:port/dbname"
    data_shape: [source]

  - code: dsn_render_refused
    python_exception: DsnRenderError
    severity: user
    raised_by: [okg.substrate.db.dsn]
    referenced_in:
      - pact/changes/dsn-module-parse-expand-redact
    fix_hint_template: null
    data_shape: []

  - code: dsn_placeholder_unset
    python_exception: DsnPlaceholderUnset
    severity: user
    raised_by: [okg.substrate.db.dsn]
    referenced_in:
      - pact/changes/dsn-module-parse-expand-redact
    fix_hint_template: "export {0}=postgresql://user:password@host:port/dbname"
    data_shape: [source, unset, empty, unsupported]

  - code: dsn_placeholder_empty
    python_exception: DsnPlaceholderEmpty
    severity: user
    raised_by: [okg.substrate.db.dsn]
    referenced_in:
      - pact/changes/dsn-module-parse-expand-redact
    fix_hint_template: "give {0} a non-empty value"
    data_shape: [source, unset, empty, unsupported]

  - code: dsn_placeholder_unsupported
    python_exception: DsnPlaceholderUnsupported
    severity: user
    raised_by: [okg.substrate.db.dsn]
    referenced_in:
      - pact/changes/dsn-module-parse-expand-redact
    fix_hint_template: "write ${NAME} and export NAME, or write the DSN literally"
    data_shape: [source, unset, empty, unsupported]

  # Both are raised while
  # READING a cluster's metadata, and both refuse rather than degrade: an
  # incomplete read must never become an empty completed scope, because a
  # completed scope retracts every node the source owns.
  # Both carry a per-raise `fix_hint` naming the endpoint or the field that
  # failed, so there is no template to substitute; and both are raised from
  # many sites whose `data` keys differ (`keys`, `type`, `rows`, `row`,
  # `scheme`, `entry`, ...), so no key is required across all of them.
  # `data_shape` is the REQUIRED set and is honestly empty rather than
  # naming one site's payload as though every site carried it.
  - code: opensearch_metadata_unavailable
    python_exception: OpenSearchMetadataError
    severity: recoverable
    raised_by:
      - okg.substrate.library.sources._opensearch_client.OpenSearchClient
    fix_hint_template: null
    data_shape: []

  - code: opensearch_declared_index_unknown
    python_exception: DeclaredServiceError
    severity: user
    raised_by:
      - okg.substrate.library.sources.opensearch_catalog.OpenSearchCatalogSource
    fix_hint_template: null
    data_shape: []

  - code: compensation_row_set_changed
    python_exception: CompensationRowSetChanged
    severity: recoverable
    raised_by:
      - okg.substrate.ingest.compensation.retract_chronos_run
    referenced_in: []
    fix_hint_template: "another writer changed the failed run's rows after the run started, so the undo rolled back and wrote nothing; the run's receipts stay 'compensating' and every publish of the deployment is refused. Retry with `okg runtime finish-undo --deployment <deployment> --apply` once that writer has stopped; if it is refused again, keep the current rows with `okg runtime finish-undo --deployment <deployment> --accept-current --reason \"<why>\" --apply` and rerun the source with `okg ingest --deployment <deployment> --include <source>`"
    data_shape: [table, source, run_id, missing_count, missing_sample]

  # A failed source run's undo (back to its run-base
  # checkpoint) has not finished. Raised by the publisher's guard, keyed on
  # receipts stuck in 'compensating' or a run base marked undo-pending.
  - code: source_run_undo_unfinished
    python_exception: SourceRunUndoUnfinished
    severity: recoverable
    raised_by:
      - okg.substrate.publisher.Publisher.cycle
      - okg ingest
    referenced_in: []
    fix_hint_template: "a failed source run's undo did not finish, so every publish of this deployment is refused until it does. Retry the undo with `okg runtime finish-undo --deployment {0} --apply`. If it is refused again because another writer changed the same rows, keep the rows as they are now with `okg runtime finish-undo --deployment {0} --accept-current --reason \"<why>\" --apply`, then rerun the source with `okg ingest --deployment {0} --include {1}`"
    data_shape: [deployment, pending_count, pending]

  # A failed run applied chunks on a branch where its
  # deployment has published, but its run-base checkpoint is gone, so it
  # cannot be undone exactly. Compensation refuses; the receipts stay
  # 'compensating' and the publish guard fires.
  - code: source_run_base_missing
    python_exception: SourceRunBaseMissing
    severity: recoverable
    raised_by:
      - okg.substrate.ingest.compensation.retract_chronos_run
    referenced_in: []
    fix_hint_template: "the failed run cannot be undone exactly, so every publish of this deployment is refused. Keep the rows as they are now with `okg runtime finish-undo --deployment {0} --accept-current --reason \"<why>\" --apply`, then rerun the source with `okg ingest --deployment {0} --include {1}`"
    data_shape: [source, run_id, branch, admission_id, deployment]

  # The undo holds the branch write lock for its whole
  # length, and its cost grows faster than linearly; above a bound of keys
  # written since the run base it refuses before writing.
  - code: source_run_undo_too_large
    python_exception: SourceRunUndoTooLarge
    severity: recoverable
    raised_by:
      - okg.substrate.ingest.compensation.retract_chronos_run
    referenced_in: []
    fix_hint_template: "the undo would hold the branch write lock too long, so it wrote nothing and every publish of this deployment is refused. Keep the rows as they are now with `okg runtime finish-undo --deployment {0} --accept-current --reason \"<why>\" --apply` and rerun the source with `okg ingest --deployment {0} --include {1}`; or raise OKG_RUN_BASE_UNDO_MAX_KEYS and retry with `okg runtime finish-undo --deployment {0} --apply`, accepting that every writer waits for it"
    data_shape: [source, run_id, branch, keys_since_run_base, max_keys]

  # Another source run of the deployment is still
  # writing; its committed chunks are not a complete run, so every publish is
  # refused (an ingest's own run-end publish waits for it first, bounded).
  - code: source_run_in_progress
    python_exception: SourceRunInProgress
    severity: recoverable
    raised_by:
      - okg.substrate.publisher.Publisher.cycle
      - okg ingest
    referenced_in: []
    fix_hint_template: "run {0} of source {1} is still writing (its owner session, pid {2}, is alive), and a publish now would show readers its unfinished records. Wait for it to finish, then publish again. If that process is gone but its database session is not (a hung connection), end the session with `SELECT pg_terminate_backend({2})`: the run then reads as ended, and `okg runtime finish-undo --deployment {3} --run-id {0} --apply` undoes its records"
    data_shape: [deployment, in_progress_count, in_progress]

  # `finish-undo --accept-current` keeps a failed
  # run's partial rows, so publishing stays refused until the source reruns
  # successfully or is retired.
  - code: source_rerun_required
    python_exception: SourceRerunRequired
    severity: recoverable
    raised_by:
      - okg.substrate.publisher.Publisher.cycle
      - okg ingest
    referenced_in: []
    fix_hint_template: "every publish of this deployment is refused until the source reruns successfully: run `okg ingest --deployment {0} --include {1}`. If it keeps failing, fix the source and run that again, or remove the source: `okg remediate retire-source --source {1} --deployment-name {0}` (a dry run that prints plan_digest and registry_source_id; it works whether or not the source is still in source_registry.yaml), then the same command with `--expected-plan-digest <plan_digest> --confirm-source <registry_source_id> --apply`, which removes all of its records and lifts this block; then delete its source_registry.yaml entry if it is still there, run `okg catalog ownership claim --deployment {0}` and publish with `okg run --once --deployment {0} --apply`"
    data_shape: [deployment, rerun_required]

  # An operator UI read passed a request parameter whose name is reserved for
  # a policy fact. Request parameters never reach the Nomos policy;
  # the refusal is a programming error in the route, not operator input.
  - code: operator_read_request_key_reserved
    python_exception: OperatorReadRequestKeyReserved
    severity: fatal
    raised_by:
      - okg.substrate.operator_read.authorize_local_operator_read
    referenced_in: []
    fix_hint_template: "rename the request parameter; a policy fact the boundary needs is added to LOCAL_OPERATOR_RESOURCE_ATTRIBUTES by name"
    data_shape: [read, reserved_keys]

  # An operator UI read passed a request the audit record cannot hold as JSON.
  # Like the reserved-key refusal it is a route bug; the console
  # answers both as a 500 carrying the code.
  - code: operator_read_request_unencodable
    python_exception: OperatorReadRequestUnencodable
    severity: fatal
    raised_by:
      - okg.substrate.operator_read.authorize_local_operator_read
    referenced_in: []
    fix_hint_template: "pass request parameters as JSON values (str, int, float, bool, None, list, dict with string keys)"
    data_shape: [read, unencodable, non_string_keys]

  # ---------- operator UI launcher ----------

  # `okg ui` found no built frontend bundle (PACT okg-ui-command). The wheel
  # does not ship the operator UI's TypeScript, so the bundle must be built in
  # a source checkout first.
  - code: operator_ui_bundle_missing
    python_exception: OperatorUiBundleMissing
    severity: user
    raised_by:
      - okg ui
    referenced_in:
      - docs/operate/operator-ui.md
    fix_hint_template: "run `npm install` once and `npm run operator-ui:build` at the root of a source checkout, or pass --dist <a built bundle directory>"
    data_shape: [bundle_dir, source]

  # The `okg ui` front door answers only GET, HEAD and OPTIONS; every other
  # method is an HTTP 405 carrying this code (PACT okg-ui-command).
  - code: operator_ui_read_only
    python_exception: OperatorUiReadOnly
    severity: user
    raised_by:
      - okg ui
    referenced_in:
      - docs/operate/operator-ui.md
    fix_hint_template: "the operator UI is read-only; change deployment state with the CLI"
    data_shape: [method, path]

  # `okg ui` serves loopback only (localhost, 127.0.0.0/8, ::1), with or
  # without an operator token, and refuses a port outside 1-65535 or a
  # non-integer OKG_VIZ_PORT (PACT okg-ui-command).
  - code: operator_ui_bind_refused
    python_exception: OperatorUiBindRefused
    severity: user
    raised_by:
      - okg ui
    referenced_in:
      - docs/operate/operator-ui.md
    fix_hint_template: "okg ui serves loopback only; bind --host 127.0.0.1 and reach it remotely through an SSH tunnel; pass --port <1-65535>"
    data_shape: [host, port, reason]

