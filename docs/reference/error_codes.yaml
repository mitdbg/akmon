  # The effective-attribute
  # payload-parity fingerprint REFUSES on a schema it cannot fingerprint
  # completely instead of narrowing its column set to whatever survives. Two
  # fingerprints taken over DIFFERENT column sets compare equal and report a
  # parity match that was never performed -- a false witness inside an
  # integrity check, which is worse than the crash it would have replaced.
  #
  # `code` is stated honestly, because a registry row that overstates itself is
  # the class of defect this file exists to prevent. The raise site
  # (attributes.py:3784, in _effective_interval_payload_signatures) constructs
  # a BARE SubstrateError -- as all fourteen raises in that module do -- so the
  # JSON envelope carries the base catch-all `substrate_error`, not the string
  # below. What IS emitted and stable is `data.reason`, whose two values are
  # `schema_predates_interval_narrow_split` and `attribute_relations_absent`
  # (attributes.py:3678-3679), deliberately distinct because a database that
  # predates the split and a database missing the relation entirely want
  # different operator fixes. So: dispatch on data.reason today; the row below
  # is the registry's name for the refusal, and `python_exception: null`
  # records that no dedicated class carries it yet. Giving it one in errors.py
  # plus `code=` at the raise site is
  # task.pre-narrow-split-upgrade-preflight.typed-refusal.
  - code: effective_attribute_payload_parity_inapplicable
    python_exception: null
    severity: fatal
    raised_by:
      - okg.substrate.attributes._effective_interval_payload_signatures
      - okg db repair-effective-attribute-intervals --apply
      - okg db prepare-effective-attribute-recovery --apply
    referenced_in:
