      - Security: reference/security.md
      - Observability: reference/observability.md
      - Database schema: reference/database-schema.md
      - SDK API: reference/sdk-api.md
      - Live HTTP bindings: reference/live-http-bindings.md
  - Develop AKMON:
      - Overview: develop/index.md
      - Architecture:
          - System overview: develop/architecture/overview.md
          - Code architecture: develop/architecture/pipeline.md
          - Responsibility map: develop/architecture/responsibility-map.md
          - Runtime: develop/architecture/runtime.md
          - Privacy: develop/architecture/privacy.md
