site_name: AKMON Documentation
site_description: Build a versioned, checked knowledge graph from your own sources and query it from people and coding agents.
site_url: https://docs.example.invalid/
repo_url: https://github.com/mitdbg/akmon
docs_dir: docs
site_dir: .scratch/docs-site
strict: true
use_directory_urls: true
# The agent-workflow, CI and QA runbooks stay on disk (PACT tier rules, CI
# tooling and tests name those paths) but the site publishes product pages
# only. documentation.yaml lists the same prefixes under `unpublished`.

theme:
  name: mkdocs
  locale: en

plugins:
  - search

# SuperFences renders fenced code nested inside list items; MkDocs' built-in
# fenced_code only recognizes fences at the top level of a page. Highlight with
# use_pygments: false keeps the class="language-<name>" output the theme's
# highlight.js reads; without it Pygments drops the language and highlight.js
# guesses (SQL shown as vbnet).
markdown_extensions:
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.superfences

nav:
  - Get started:
      - What AKMON is: README.md
      - Quickstart: start/quickstart.md
      - The AKMON model: start/concepts.md
      - How information becomes searchable: start/data-lifecycle.md
      - Install and build a first graph: operate/install.md
      - Evaluate from source (optional): start/evaluate-from-source.md
  - Connect your data:
      - Choose a route and add a source: use/sources/index.md
      - Local folder source: use/sources/local-folder.md
      - GitHub source: use/sources/github.md
      - Bring your own data with a manifest: use/sources/manifest.md
      - Source manifest reference: reference/source-manifest.md
      - Configure a deployment: operate/configure.md
      - Profiles:
          - Choose a profile: use/profiles/index.md
          - Academic researcher: use/profiles/academic-researcher.md
  - Connect agents:
      - Connect an agent: use/agents/index.md
      - Query and trace the graph: use/search/index.md
      - Set up chat: operate/chat.md
  - Run it as a service:
      - Plan a deployment: operate/plan.md
      - Run it as a service: operate/index.md
      - Install from a wheel or release: operate/install-packaged.md
      - Back up, upgrade, restore, retire: operate/lifecycle.md
      - Live relations: operate/live-relations.md
      - Operator UI: operate/operator-ui.md
      - Deployments:
