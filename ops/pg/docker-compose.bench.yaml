# Bench-lane-only Postgres override.
#
# Mirrors the operator-ui audit lane's CI Postgres RCA: OpenStack runners can
# report the Docker bridge service healthy while host clients still hit a broken
# docker-proxy path. The benchmark needs real DB artifacts for its static report,
# so run Postgres directly on host loopback with a lane-specific port/project.
services:
  db:
    container_name: okg-bench-pg
    network_mode: host
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_cron,pg_textsearch
      - -c
      - cron.database_name=okg
      - -c
      - max_connections=100
      - -c
      # TimescaleDB worker slots; see ops/pg/docker-compose.yaml (issue #3143).
      - max_worker_processes=32
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - port=5545
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d okg -h 127.0.0.1 -p 5545"]
