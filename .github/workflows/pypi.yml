name: pypi

# Publishes the wheel of one public AKMON release to PyPI, as the project
# `akmon`, so `pip install akmon` installs it and a package can depend on it.
# The distribution is akmon from v0.6.0 (akmon-X.Y.Z-py3-none-any.whl); the
# import package and the command stay `okg`. Releases up to v0.5.0 shipped the
# distribution okg (okg-X.Y.Z-py3-none-any.whl): this workflow refuses them,
# so an okg wheel can never reach the akmon project.
#
# Why a workflow of its own, dispatched by hand after a release, and not a
# job inside release.yml:
#   1. A release runs the release.yml already on main when it is dispatched,
#      and a change to it reaches main only with the next release. A PyPI job
#      added there would first run one release after the release that ships
#      it. This workflow can publish the very release that shipped it.
#   2. It can publish the wheel of any public akmon-named release (an earlier
#      one too) without running a release again: a release's tag and package
#      references are written once and cannot be made again.
#
# Trusted publishing, no token anywhere: PyPI trusts this workflow by name.
# The PyPI project `akmon` names the publisher owner mitdbg, repository akmon,
# workflow pypi.yml, environment `pypi`. The publish job asks GitHub for a
# short-lived OIDC identity (id-token: write) and PyPI exchanges it for an
# upload token valid for minutes and for this project only. No API token is
# stored as a secret or anywhere else.
#
# The real control is the `pypi` environment: its deployment-branch policy
# must name main only, and its required reviewer (the same as `release`)
# approves every upload. A dispatch from another branch runs that branch's
# copy of this file, so the guard job below cannot stop it; the guard only
# makes a dispatch from any other ref fail visibly, and the environment's
# branch policy is what keeps such a run from getting PyPI's trust.
#
# Order is the point:
#   1. check (contents read, no secret, no environment), main's release
#      script only: refuse unless the tag's pyproject.toml names the
#      distribution akmon at the tag's version, and the GitHub release of the
#      tag is public, not
#      a prerelease, and it and its wheel were created by github-actions[bot]
#      (release.yml's publish job), and its tag commit is on main; download
#      the wheel; refuse unless its sha256 is the digest GitHub recorded for
#      the asset; take its sha256 for publish right then, before anything but
#      the pinned pyyaml is installed; check it again as release.yml's publish
#      job did (the version, the earlier releases' contracts it carries, every
#      file a byte-for-byte copy of the tag's tree, checked out beside as
#      data) and its METADATA against the tag's pyproject.toml, with Name
#      akmon; keep only the wheel.
#   2. twine (contents read): take the kept wheel by artifact id, confirm its
#      sha256, install twine from the hash-pinned scripts/twine-requirements.txt
#      and run `twine check --strict`. Its third-party code never touches the
#      bytes publish uploads, and publish reads none of its outputs.
#   3. publish (environment `pypi`, id-token write and nothing else): no
#      checkout and no repository code. It takes the kept wheel by artifact
#      id, refuses unless it is the one akmon-*.whl file, its sha256 is the
#      one check recorded (the bytes whose METADATA Name check proved is
#      akmon), and that is also the digest GitHub's API reports for the
#      release asset (read anonymously), and uploads it with the pinned PyPI
#      publish action. A version PyPI already holds fails the upload: PyPI
#      never replaces a file, and a rerun after a success says so rather than
#      passing quietly.
#
# Nothing in the release's own tree runs in any job: check runs only the
# script from the commit this workflow was dispatched from (main) and reads
# the release's tree as data.
#
# Remaining risk: the publish action is pinned to a commit, but at run time it
# pulls its container image from ghcr.io/pypa/gh-action-pypi-publish by a tag
# named for that commit, not by digest. Whoever controls that image tag
# controls the upload step.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a public AKMON release named akmon, v0.MINOR.PATCH (v0.6.0 or later)
        required: true
        type: string

permissions: {}

concurrency:
  group: akmon-pypi
  cancel-in-progress: false

jobs:
  # A visible failure for a dispatch from any ref but main. The `pypi`
  # environment's branch policy is the control (see the header).
  guard:
    name: refuse a dispatch from any ref but main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse unless dispatched from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::pypi runs only from refs/heads/main, not ${REF}"
            exit 1
          fi

  check:
    name: check the public release's wheel again
    needs: guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      wheel: ${{ steps.release.outputs.wheel }}
      wheel-artifact: ${{ steps.upload.outputs.artifact-id }}
      wheel-sha256: ${{ steps.wheel.outputs.sha256 }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Refuse a tag that is not v0.MINOR.PATCH
        run: |
          if ! [[ "$TAG" =~ ^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the tag input must be v0.MINOR.PATCH"
            exit 1
          fi
      # main's copy of this repository: the script below is the reviewed one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The only package installed before the wheel's sha256 is taken.
      - name: Install the release script dependency
        working-directory: ${{ runner.temp }}
        run: python -I -m pip install "pyyaml==6.0.3"
      # Only a release release.yml published: a draft has not passed its
      # anonymous-pull step, and a release or wheel someone made by hand is
      # not a release at all. Only an akmon release: the wheel's name comes
      # from the tag's own pyproject.toml, and any project name but akmon
      # (okg, up to v0.5.0) refuses here.
      - name: Require an akmon release that release.yml published, on main
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          wheel="$(python scripts/akmon_release.py release-wheel --tag "$TAG" --require-name akmon \
            | sed -n 's/^wheel=//p')"
          test "$wheel" = "akmon-${TAG#v}-py3-none-any.whl"
          python scripts/akmon_release.py pipeline-release --tag "$TAG" --asset "$wheel"
          revision="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          tree="$(git rev-parse "refs/tags/${TAG}^{tree}")"
          if ! git merge-base --is-ancestor "$revision" "$GITHUB_SHA"; then
            echo "::error::the tag ${TAG} (${revision}) is not on main"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
      - name: Download the release's wheel
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          WHEEL: ${{ steps.release.outputs.wheel }}
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/release-assets"
          mkdir "$assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$WHEEL" --dir "$assets"
          test "$(find "$assets" -mindepth 1 | wc -l)" = 1
          test -f "${assets}/${WHEEL}"
      # The bytes downloaded are the bytes the release published: GitHub
      # records each asset's sha256 digest when it is uploaded.
      - name: Require the wheel to be the asset GitHub reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WHEEL: ${{ steps.release.outputs.wheel }}
        run: >-
          python scripts/akmon_release.py assets --tag "$TAG" --check
          "${RUNNER_TEMP}/release-assets/${WHEEL}"
      # Right after the digest check, before any other step: publish uploads
      # only a wheel with exactly this sha256.
      - name: Digest the wheel for publish
        id: wheel
        working-directory: ${{ runner.temp }}
        env:
          WHEEL: ${{ steps.release.outputs.wheel }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/pypi-dist"
          mkdir "$out"
          cp "${RUNNER_TEMP}/release-assets/${WHEEL}" "$out/"
          digest="$(sha256sum "${out}/${WHEEL}" | cut -d ' ' -f 1)"
          echo "sha256=${digest}" >> "$GITHUB_OUTPUT"
          echo "${WHEEL} sha256 ${digest}" >> "$GITHUB_STEP_SUMMARY"
      - name: Put the release's tree beside this checkout
        env:
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null worktree add --detach "${RUNNER_TEMP}/release-tree" "$REVISION"
          test "$(git -C "${RUNNER_TEMP}/release-tree" rev-parse HEAD)" = "$REVISION"
      # The same checks release.yml's publish job runs before it attaches the
      # wheel, on the kept copy: this version, exactly the earlier releases'
      # contracts, every file a byte-for-byte copy of the release's tree, and
      # METADATA (name, version, Requires-Python, Requires-Dist, extras) as
      # the tree's pyproject.toml declares it, with Name akmon.
      - name: Check the wheel as the release did
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.release.outputs.revision }}
          TREE_ID: ${{ steps.release.outputs.tree }}
          WHEEL: ${{ steps.release.outputs.wheel }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          wheel="${RUNNER_TEMP}/pypi-dist/${WHEEL}"
          history="$(python scripts/akmon_release.py history --tag "$TAG" | sed -n 's/^history=//p')"
          contracts="$(python scripts/akmon_release.py stage-contracts --history "$history" \
            --dir "${RUNNER_TEMP}/contracts" | sed -n 's/^contracts=//p')"
          python scripts/akmon_release.py check-wheel "$wheel" --version "$version" --contracts "$contracts"
          python scripts/akmon_release.py wheel-source "$wheel" \
            --tree "${RUNNER_TEMP}/release-tree" --revision "$REVISION" --tree-id "$TREE_ID" \
            --version "$version" --contracts "$contracts"
          python scripts/akmon_release.py wheel-metadata "$wheel" \
            --tree "${RUNNER_TEMP}/release-tree" --version "$version" --require-name akmon
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-wheel
          path: ${{ runner.temp }}/pypi-dist/
          if-no-files-found: error
          retention-days: 7

  # twine and its dependencies are third-party code: they run here, on a
  # copy, and nothing they could change reaches publish.
  twine:
    name: check the kept wheel's metadata as PyPI will
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.check.outputs.wheel-artifact }}
          path: ${{ runner.temp }}/dist
      - name: Confirm the kept wheel is the one check proved
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED: ${{ needs.check.outputs.wheel-sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          files=(dist/*)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::the kept artifact holds ${#files[@]} files, not one wheel"
            exit 1
          fi
          wheel="${files[0]}"
          case "$wheel" in
            dist/akmon-*-py3-none-any.whl) ;;
            *) echo "::error::the kept file is not an akmon wheel"; exit 1 ;;
          esac
          if [ -L "$wheel" ] || [ ! -f "$wheel" ]; then
            echo "::error::the kept wheel is not a regular file"
            exit 1
          fi
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          echo "${EXPECTED}  ${wheel}" | sha256sum -c -
      - name: Install twine from the hash-pinned requirements
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -m pip install --require-hashes --only-binary :all:
          -r "${GITHUB_WORKSPACE}/scripts/twine-requirements.txt"
      - name: Check the wheel's metadata as PyPI will
        working-directory: ${{ runner.temp }}
        run: python -I -m twine check --strict dist/akmon-*-py3-none-any.whl

  # The only job that can ask for an identity PyPI trusts. It runs no code from
  # this repository: no checkout, only the kept wheel, two digest checks and
  # the pinned publish action.
  publish:
    name: upload the checked wheel to PyPI
    needs: [guard, check, twine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/akmon/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.check.outputs.wheel-artifact }}
          path: dist
      - name: Confirm the kept wheel is the one check proved
        env:
          EXPECTED: ${{ needs.check.outputs.wheel-sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          files=(dist/*)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::the kept artifact holds ${#files[@]} files, not one wheel"
            exit 1
          fi
          wheel="${files[0]}"
          case "$wheel" in
            dist/akmon-*-py3-none-any.whl) ;;
            *) echo "::error::the kept file is not an akmon wheel"; exit 1 ;;
          esac
          if [ -L "$wheel" ] || [ ! -f "$wheel" ]; then
            echo "::error::the kept wheel is not a regular file"
            exit 1
          fi
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          echo "${EXPECTED}  ${wheel}" | sha256sum -c -
      # Read anonymously from the public API: this job holds no token but its
      # OIDC identity.
      - name: Confirm GitHub records the same digest for the release asset
        env:
          TAG: ${{ needs.check.outputs.tag }}
          EXPECTED: ${{ needs.check.outputs.wheel-sha256 }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          name="akmon-${TAG#v}-py3-none-any.whl"
          test -f "dist/${name}"
          release="$(curl --fail --silent --show-error --retry 3 \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          recorded="$(jq -er --arg name "$name" \
            '[.assets[] | select(.name == $name and .state == "uploaded") | .digest]
             | if length == 1 then .[0] else error("not exactly one uploaded asset") end' <<< "$release")"
          if [ "$recorded" != "sha256:${EXPECTED}" ]; then
            echo "::error::GitHub records ${recorded} for ${name}, not sha256:${EXPECTED}"
            exit 1
          fi
      # skip-existing stays off: a version PyPI already holds fails here.
      - name: Upload to PyPI by trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
